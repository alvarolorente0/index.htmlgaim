<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Montero Realista 3D - Balística Fina</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050804; font-family: 'Courier New', Courier, monospace; color: #fff; }
        
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        canvas { width: 100%; height: 60%; background: #141a10; display: block; }
        
        /* Trackpad inferior táctil */
        #trackpad { width: 100%; height: 40%; background: linear-gradient(135deg, #1a120b, #080503); border-top: 4px solid #2b1c0e; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; text-align: center; padding: 20px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        #trackpad.active { background: linear-gradient(135deg, #24190f, #0d0805); }
        
        #cadenceBar { position: absolute; top: 0; left: 0; height: 6px; background: #ff3b30; width: 100%; transition: width 0.05s linear; }
        #cadenceBar.ready { background: #4cd964; }

        /* Interfaces */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,5,3,0.94); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 25px; text-align: center; }
        .menu-card { background: #11140f; border: 2px solid #3d3224; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 0 25px rgba(0,0,0,0.9); }
        
        h1 { color: #b89063; font-size: 20px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }
        h3 { color: #768071; font-size: 12px; margin: 12px 0 6px 0; text-align: left; text-transform: uppercase; letter-spacing: 1px; }
        
        button { background: #24180d; color: #ded8ce; border: 2px solid #422d1a; padding: 11px 16px; font-size: 12px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; margin: 5px 0; text-transform: uppercase; transition: all 0.1s ease; }
        button:active, button.selected { background: #b89063; color: #111; border-color: #fff; box-shadow: 0 0 10px rgba(184,144,99,0.4); }
        
        .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .selector-grid button { font-size: 11px; padding: 8px; margin: 0; }
        
        /* HUD superior */
        #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; font-size: 12px; font-weight: bold; text-shadow: 2px 2px 4px #000; color: #ede8df; }
        
        .top-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 6; }
        .ctrl-btn { width: 36px; height: 36px; padding: 0; margin: 0; border-radius: 50%; background: rgba(36,24,13,0.8); display: flex; justify-content: center; align-items: center; font-size: 15px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <span id="txtTiempo">TIEMPO: 45s</span>
        <span id="txtKills">RESES: 0/0</span>
    </div>
    
    <div class="top-controls">
        <button id="btnHome" class="ctrl-btn">🏠</button>
        <button id="pauseBtn" class="ctrl-btn">⏸</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="trackpad">
        <div id="cadenceBar"></div>
        <span id="trackpadLabel">SISTEMA EN ADQUISICIÓN...</span>
    </div>

    <div id="mainMenu" class="overlay">
        <div class="menu-card">
            <h1>MONTERÍA REALISTA 3D</h1>
            <p style="font-size: 11px; color:#5c6358; margin-bottom: 12px;">Balística Adaptativa y Grandes Macarenos</p>
            
            <h3>MODALIDAD</h3>
            <div class="selector-grid">
                <button id="btnModoCortadero" class="selected">Monte / Cortadero</button>
                <button id="btnModoPatos">Ribera / Patos</button>
            </div>

            <div id="panelArmasMonte">
                <h3>OPCIÓN DE ARMA</h3>
                <div class="selector-grid">
                    <button id="btnRifleMenu" class="selected">Rifle Continuo</button>
                    <button id="btnEscopetaMenu">Semiaut. (Bala)</button>
                </div>
            </div>

            <div id="panelEspecies">
                <h3>ESPECIES DE MONTE</h3>
                <div class="selector-grid">
                    <button id="cfgBoar" class="selected">Jabalí Viejo</button>
                    <button id="cfgCiervo" class="selected">Venado</button>
                    <button id="cfgMuflon" class="selected">Muflón</button>
                    <button id="cfgCorzo" class="selected">Corzo</button>
                </div>
            </div>

            <button id="btnStart" style="background:#2e3d27; border-color:#44593a; margin-top:15px; font-size:14px; color:#fff;">Entrar al Puesto</button>
        </div>
    </div>

    <div id="resultsMenu" class="overlay" style="display:none;">
        <div class="menu-card">
            <h1>PLANTILLA DE COBROS</h1>
            <p id="resDetails" style="margin: 15px 0; font-size: 13px; line-height: 1.6; color: #a9b5a6;"></p>
            <button id="btnRestart" style="background:#2e3d27;">Doblar Puesto</button>
        </div>
    </div>

    <div id="pauseMenu" class="overlay" style="display:none;">
        <div class="menu-card">
            <h1>MANO SUSPENDIDA</h1>
            <div id="panelArmasPausa">
                <h3>CAMBIO DE ARMA</h3>
                <button id="btnRifle" class="selected">Rifle de Caza</button>
                <button id="btnEscopeta">Semiautomática Bala</button>
            </div>
            <p id="lblAvisoPatos" style="display:none; font-size:11px; color:#bd4242; margin: 10px 0;">* En río se utiliza choke cerrado de perdigón automáticamente.</p>
            <hr style="border:1px solid #232920; margin:12px 0;">
            <button id="btnResume" style="background:#44593a; color:#fff;">Quitar Seguro</button>
        </div>
    </div>
</div>

<script>
// --- MOTOR SINTÉTICO DE AUDIO REALISTA ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'shotgun' || type === 'rifle') {
        let isRifle = type === 'rifle';
        let bufferSize = audioCtx.sampleRate * (isRifle ? 0.6 : 0.45), buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        let filter = audioCtx.createBiquadFilter(); filter.type = isRifle ? 'bandpass' : 'lowpass'; filter.frequency.setValueAtTime(isRifle ? 500 : 350, now);
        let gain = audioCtx.createGain(); gain.gain.setValueAtTime(isRifle ? 2.0 : 1.7, now); gain.gain.exponentialRampToValueAtTime(0.001, now + (isRifle ? 0.5 : 0.35));
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(now);
    }
}

// --- VARIABLES MAESTRAS Y CONFIGURACIÓN ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const trackpad = document.getElementById('trackpad');
const cadenceBar = document.getElementById('cadenceBar');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight * 0.6; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

let isPaused = true, gameTimer = 45, totalSpawns = 0, totalKills = 0, lastSpawnTime = 0, gameActive = false;
let currentWeapon = 'rifle', canShoot = true, lastShotTime = 0, recoilY = 0;
let PiaraAlerted = false, entities = [], particles = [], bushes = [];
let crosshair = { x: canvas.width / 2, y: canvas.height / 2 };

// Ajustes Balísticos Modificados
const FIRE_DELAY = 450; 
const PATO_CHOKE_RADIUS = 40; // Plomeo cerrado y exigente para patos
const TRACKPAD_SENSITIVITY = 1.65;
let mode = 'cortadero'; 
let activeSpecies = { boar: true, ciervo: true, muflon: true, corzo: true };

function generateEnvironment() {
    bushes = [];
    let numBushes = mode === 'cortadero' ? 24 : 12;
    for (let i = 0; i < numBushes; i++) {
        bushes.push({
            x: Math.random() * canvas.width,
            y: canvas.height * (0.46 + Math.random() * 0.36),
            radius: 12 + Math.random() * 22,
            color: `rgb(${40 + Math.random()*15}, ${55 + Math.random()*15}, ${28 + Math.random()*10})`
        });
    }
    bushes.sort((a, b) => a.y - b.y);
}

// --- CLASE ANIMAL: TEXTURAS EN PELO, CUERNAS Y GRANDES MACARENOS ---
class Animal {
    constructor(type, speed, direction, delay = 0, isFemale = false, packLeader = null) {
        this.type = type;
        this.direction = direction;
        this.isFemale = isFemale;
        this.packLeader = packLeader;

        if (type === 'pato') {
            this.zDepth = 0.9; this.scaleFactor = 0.65;
        } else {
            this.zDepth = currentWeapon === 'rifle' ? 0.38 : 1.05;
            this.scaleFactor = this.zDepth;
        }

        // Velocidades realistas iniciales
        if (type === 'corzo') {
            this.baseSpeed = 1.45;
        } else if (type === 'pato') {
            this.baseSpeed = 2.4;
        } else {
            this.baseSpeed = 0.70 + speed * 0.35; // Trote montero asentado
        }

        if (currentWeapon === 'rifle' && type !== 'pato') {
            this.baseSpeed *= 0.65; 
        }

        this.currentSpeed = this.baseSpeed * direction;

        // Dimensiones físicas (Jabalí siempre grande navajero)
        if (type === 'big_boar')       { this.w = 85; this.h = 52; }
        else if (type === 'ciervo')     { this.w = 100; this.h = 85; }
        else if (type === 'corzo')      { this.w = 52; this.h = 48; }
        else if (type === 'muflon')     { this.w = 72; this.h = 50; }
        else if (type === 'pato')       { this.w = 38; this.h = 24; }

        this.width = this.w * this.scaleFactor;
        this.height = this.h * this.scaleFactor;
        this.x = direction === 1 ? -this.width - delay : canvas.width + delay;
        
        if (type === 'pato') {
            this.y = canvas.height * 0.15 + (Math.random() * 30);
        } else {
            this.y = currentWeapon === 'rifle' ? (canvas.height * 0.44 + (Math.random()*15)) : (canvas.height * 0.54 + Math.random() * 25);
        }

        this.dead = false; this.deathTimer = 0; this.angle = 0; this.legCycle = 0;
        this.antlerSize = isFemale ? 0 : (0.9 + Math.random() * 0.5); 

        this.vy = 0; 
        this.isFloating = false;
        this.waterLevel = canvas.height * 0.46 + (Math.random() * 30);
    }

    update(dt) {
        const step = dt / 16.66;

        if (this.dead) {
            this.deathTimer += dt;
            if (this.type === 'pato') {
                if (!this.isFloating) {
                    this.vy += 0.35 * step; this.y += this.vy * step;
                    this.x += this.currentSpeed * 0.25 * step;
                    if (this.angle < Math.PI) this.angle += 0.15 * step;
                    if (this.y >= this.waterLevel) { this.y = this.waterLevel; this.isFloating = true; this.vy = 0; }
                } else {
                    this.x += 0.4 * step; this.y += Math.sin(performance.now() * 0.005) * 0.1;
                }
            } else {
                if (this.angle < Math.PI / 2) this.angle += 0.22 * step;
            }
            return;
        }

        if (this.packLeader && !this.packLeader.dead) {
            this.x = this.packLeader.x - (45 * this.direction * this.scaleFactor);
            this.y = this.packLeader.y + (4 * (this.isFemale ? 1 : -1));
            this.currentSpeed = this.packLeader.currentSpeed;
        }

        // Arrancada veloz tras el estruendo
        if (PiaraAlerted && this.type !== 'pato') {
            let panicMultiplier = this.type === 'corzo' ? 2.5 : 2.2;
            this.currentSpeed = this.baseSpeed * panicMultiplier * this.direction;
        }

        this.x += this.currentSpeed * step;
        this.legCycle += Math.abs(this.currentSpeed) * 0.24 * step;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
        ctx.rotate(this.angle);
        if (this.direction === -1 && !this.isFloating) ctx.scale(-1, 1);

        let swing = this.dead ? 0 : Math.sin(this.legCycle) * 7;
        let s = this.scaleFactor;

        if (this.type === 'ciervo') {
            ctx.fillStyle = '#26190e'; 
            ctx.fillRect(-10*s, 12*s, 3*s, 32*s - swing); ctx.fillRect(14*s, 12*s, 3*s, 32*s + swing);
            ctx.fillRect(-5*s, 12*s, 3*s, 32*s + swing); ctx.fillRect(19*s, 12*s, 3*s, 32*s - swing);
            
            let bodyGrad = ctx.createRadialGradient(-3*s, -4*s, 4*s, -1*s, 0, 32*s);
            bodyGrad.addColorStop(0, '#80542d'); bodyGrad.addColorStop(0.7, '#59381b'); bodyGrad.addColorStop(1, '#2e1c0c');
            ctx.fillStyle = bodyGrad; ctx.beginPath();
            ctx.moveTo(-34*s, -4*s); ctx.quadraticCurveTo(-15*s, -18*s, 4*s, -10*s);
            ctx.lineTo(24*s, -6*s); ctx.lineTo(20*s, 14*s); ctx.lineTo(-26*s, 14*s); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#fff9f2'; ctx.beginPath(); ctx.ellipse(-31*s, 2*s, 4*s, 8*s, 0, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#59381b'; ctx.beginPath();
            ctx.moveTo(8*s, -8*s); ctx.lineTo(24*s, -34*s); ctx.lineTo(34*s, -32*s); ctx.lineTo(22*s, 8*s); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#704722'; ctx.beginPath();
            ctx.moveTo(24*s, -34*s); ctx.lineTo(42*s, -30*s); ctx.lineTo(34*s, -22*s); ctx.closePath(); ctx.fill();

            if (!this.isFemale) {
                ctx.strokeStyle = '#e3ded5'; ctx.lineWidth = 2.2 * s; ctx.beginPath();
                let hL = 52 * this.antlerSize * s;
                ctx.moveTo(26*s, -34*s); ctx.quadraticCurveTo(18*s, -34*s - hL*0.6, 6*s, -32*s - hL);
                ctx.moveTo(22*s, -34*s - hL*0.2); ctx.lineTo(32*s, -34*s - hL*0.4);
                ctx.stroke();
            }
        } 
        else if (this.type === 'corzo') {
            // Estructura estilizada del corzo con cuerna más alta y visible
            ctx.fillStyle = '#47280b'; ctx.fillRect(-5*s, 10*s, 2.5*s, 22*s - swing); ctx.fillRect(8*s, 10*s, 2.5*s, 22*s + swing);
            let corzoGrad = ctx.createRadialGradient(-1*s, -2*s, 2*s, 0, 0, 16*s);
            corzoGrad.addColorStop(0, '#bd6f28'); corzoGrad.addColorStop(0.8, '#8a4e17'); corzoGrad.addColorStop(1, '#422409');
            ctx.fillStyle = corzoGrad; ctx.beginPath();
            ctx.moveTo(-18*s, -6*s); ctx.quadraticCurveTo(-4*s, -11*s, 8*s, -6*s); ctx.lineTo(12*s, 10*s); ctx.lineTo(-16*s, 10*s); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-16*s, 1*s, 4*s, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#8a4e17'; ctx.beginPath(); ctx.moveTo(4*s, -5*s); ctx.lineTo(11*s, -24*s); ctx.lineTo(17*s, -22*s); ctx.lineTo(11*s, 6*s); ctx.closePath(); ctx.fill();
            
            // Cuerna del "Duende" más larga, perlada y marcada
            if (!this.isFemale) {
                ctx.strokeStyle = '#3d362d'; ctx.lineWidth = 2.0 * s; ctx.beginPath();
                ctx.moveTo(13*s, -24*s); ctx.lineTo(10*s, -39*s); // Garra central alta
                ctx.moveTo(12*s, -31*s); ctx.lineTo(15*s, -36*s); // Garra trasera
                ctx.stroke();
            }
        }
        else if (this.type === 'muflon') {
            ctx.fillStyle = '#170e08'; ctx.fillRect(-7*s, 11*s, 3.5*s, 20*s - swing); ctx.fillRect(7*s, 11*s, 3.5*s, 20*s + swing);
            let mufGrad = ctx.createRadialGradient(-2*s, -1*s, 3*s, 0, 0, 22*s);
            mufGrad.addColorStop(0, '#663f23'); mufGrad.addColorStop(0.75, '#402613'); mufGrad.addColorStop(1, '#170e08');
            ctx.fillStyle = mufGrad; ctx.beginPath(); ctx.ellipse(0, 0, 24*s, 14*s, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#faede3'; ctx.beginPath(); ctx.ellipse(-1*s, -1*s, 11*s, 7*s, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#301b0c'; ctx.beginPath(); ctx.moveTo(10*s, -6*s); ctx.lineTo(16*s, -20*s); ctx.lineTo(24*s, -14*s); ctx.closePath(); ctx.fill();
            if (!this.isFemale) {
                ctx.strokeStyle = '#241b14'; ctx.lineWidth = 5 * s; ctx.beginPath();
                ctx.arc(14*s, -14*s, 12*s, Math.PI * 1.3, Math.PI * 0.4); ctx.stroke();
            }
        }
        else if (this.type === 'pato') {
            ctx.fillStyle = this.isFloating ? '#1c2833' : '#1c3144'; ctx.beginPath(); ctx.ellipse(0, 0, 16*s, 8*s, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#216c3b'; ctx.beginPath(); ctx.arc(11*s, -6*s, 5*s, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fca311'; ctx.fillRect(15*s, -7*s, 5*s, 2.5*s);
            ctx.fillStyle = '#fff'; ctx.fillRect(5*s, -2*s, 6*s, 1*s);
            if (!this.dead) {
                ctx.fillStyle = '#8d99ae'; ctx.save(); ctx.translate(-2*s, -2*s); ctx.rotate(Math.sin(this.legCycle)*0.95); ctx.fillRect(-2*s, -12*s, 7*s, 12*s); ctx.restore();
            }
        }
        else {
            // --- JABALÍ VIEJO MACARENO ULTRA-REALISTA (FORMA, BORRA Y PELO) ---
            // Patas negras recias
            ctx.fillStyle = '#050505'; 
            ctx.fillRect(-15*s, 14*s, 6*s, 15*s - swing); ctx.fillRect(12*s, 14*s, 6*s, 15*s + swing);

            // Capa base de pelaje (Borra oscura gris/marrón de cochino viejo)
            let boarGrad = ctx.createLinearGradient(-35*s, 0, 30*s, 0);
            boarGrad.addColorStop(0, '#0f0e0d'); boarGrad.addColorStop(0.5, '#24201c'); boarGrad.addColorStop(1, '#080807');
            ctx.fillStyle = boarGrad;
            
            // Cuerpo ahusado con gran cruz (Lomo alto erizado)
            ctx.beginPath();
            ctx.moveTo(-34*s, 5*s);
            ctx.quadraticCurveTo(-12*s, -25*s, 8*s, -16*s); // Silueta de la cruz y cerdas del lomo
            ctx.lineTo(24*s, -1*s); ctx.lineTo(15*s, 15*s); ctx.lineTo(-26*s, 14*s);
            ctx.closePath(); ctx.fill();

            // Dibujo de cerdas sueltas (Efecto óptico de pelo hirsuto)
            ctx.strokeStyle = '#141210'; ctx.lineWidth = 1.5;
            ctx.beginPath();
            for(let i = -18; i < 10; i += 4) {
                ctx.moveTo(i*s, -14*s); ctx.lineTo((i-2)*s, -21*s); // Pelo de la espina dorsal
            }
            ctx.stroke();

            // Jeta afilada y potente cabeza de macho viejo
            ctx.fillStyle = '#0f0e0d'; ctx.beginPath();
            ctx.moveTo(14*s, -5*s); ctx.lineTo(36*s, 7*s); ctx.lineTo(12*s, 15*s); ctx.closePath(); ctx.fill();
            
            // Grandes defensas blancas (Navajas curvadas rompiendo la jeta)
            ctx.fillStyle = '#ffffff'; 
            ctx.beginPath(); ctx.moveTo(23*s, 6*s); ctx.lineTo(25*s, 1*s); ctx.lineTo(21*s, 5*s); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
    }
}

function spawnControl() {
    if (!gameActive || isPaused) return;
    if (entities.length <= 1) spawnGroup();
}

function spawnGroup() {
    const direction = Math.random() > 0.5 ? 1 : -1;
    const baseSpeed = 0.5 + Math.random() * 0.4;

    let pool = [];
    if (mode === 'cortadero') {
        if (activeSpecies.boar) pool.push('boar');
        if (activeSpecies.ciervo) pool.push('ciervo');
        if (activeSpecies.muflon) pool.push('muflon');
        if (activeSpecies.corzo) pool.push('corzo');
    } else {
        pool.push('pato');
    }

    if (pool.length === 0) return;
    let chosen = pool[Math.floor(Math.random() * pool.length)];

    if (chosen === 'boar') {
        // Solo grandes cochinos navajeros solitarios o en parejas de machos
        totalSpawns++;
        entities.push(new Animal('big_boar', baseSpeed, direction));
        if (Math.random() < 0.40) {
            totalSpawns++;
            entities.push(new Animal('big_boar', baseSpeed * 0.95, direction, 75 + Math.random()*40));
        }
    } 
    else if (chosen === 'ciervo') {
        totalSpawns++;
        let leader = new Animal('ciervo', baseSpeed * 0.9, direction, 0, false);
        entities.push(leader);
        let numHembras = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < numHembras; i++) {
            totalSpawns++; entities.push(new Animal('ciervo', baseSpeed * 0.9, direction, 0, true, leader));
        }
    } 
    else if (chosen === 'muflon') {
        totalSpawns++;
        let lider = new Animal('muflon', baseSpeed * 0.95, direction, 0, false);
        entities.push(lider);
        for (let i = 0; i < 2; i++) {
            totalSpawns++; entities.push(new Animal('muflon', baseSpeed * 0.95, direction, 0, true, lider));
        }
    } 
    else if (chosen === 'corzo') {
        totalSpawns++;
        entities.push(new Animal('corzo', baseSpeed, direction));
    }
    else if (chosen === 'pato') {
        let numPatos = 2 + Math.floor(Math.random() * 2);
        let d = 0;
        for (let i = 0; i < numPatos; i++) {
            totalSpawns++; d += 50 + Math.random()*40;
            entities.push(new Animal('pato', baseSpeed * 1.05, direction, d));
        }
    }
}

// --- BALÍSTICA PROPORCIONAL SEGÚN VELOCIDAD ---
function fire() {
    if (!canShoot || isPaused || !gameActive) return;

    canShoot = false;
    lastShotTime = performance.now();
    cadenceBar.classList.remove('ready');

    const shotX = crosshair.x;
    const shotY = crosshair.y;
    let hitAnything = false;

    if (mode === 'patos') {
        // MODO PATOS: Escopeta con perdigonazo / plomeo muy cerrado (40px)
        playSound('shotgun'); recoilY = -30;

        for (let i = 0; i < 15; i++) {
            let angle = Math.random() * Math.PI * 2;
            let dist = Math.random() * PATO_CHOKE_RADIUS;
            particles.push({
                x: shotX + Math.cos(angle) * dist, y: shotY + Math.sin(angle) * dist,
                vx: (Math.random() - 0.5) * 1, vy: (Math.random() - 0.5) * 1,
                radius: 1, alpha: 0.8, color: '#eceff1', life: 6
            });
        }

        for (let ent of entities) {
            if (ent.dead) continue;
            let entCenterX = ent.x + ent.width / 2;
            let entCenterY = ent.y + ent.height / 2;
            let distance = Math.hypot(shotX - entCenterX, shotY - entCenterY);

            if (distance <= PATO_CHOKE_RADIUS + (ent.width / 2)) {
                createBloodParticles(entCenterX, entCenterY);
                hitAnything = true; ent.dead = true; totalKills++;
            }
        }
    } else {
        // CAZA MAYOR (Rifle o Escopeta Bala): Proyectil único con adelanto adaptativo
        if (currentWeapon === 'rifle') { playSound('rifle'); recoilY = -42; } 
        else { playSound('shotgun'); recoilY = -40; } // La bala de escopeta pega fuerte coz

        for (let ent of entities) {
            if (ent.dead) continue;

            // ADELANTO REALISTA ADAPTATIVO:
            // Si van despacio (paso inicial), el "flightTime" visual tiende a cero -> Apuntar al cuerpo.
            // Si van rápido (estampida alertada), se activa un sutil retraso de bala -> Exige adelantar un poco el hocico.
            let isRunning = PiaraAlerted; 
            let delaySeconds = isRunning ? 0.16 : 0.01; 

            const targetFutureX = ent.x + (ent.currentSpeed * delaySeconds * 60);

            if (shotX >= targetFutureX && shotX <= targetFutureX + ent.width && shotY >= ent.y && shotY <= ent.y + ent.height) {
                createBloodParticles(shotX, shotY);
                hitAnything = true; ent.dead = true; totalKills++;
                break;
            }
        }
    }
    
    if (!hitAnything && mode === 'cortadero') {
        for(let i=0; i<8; i++) {
            particles.push({
                x: shotX, y: shotY, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3,
                radius: 1.5, alpha: 1, color: '#544738', life: 10
            });
        }
    }
    
    if (!PiaraAlerted) PiaraAlerted = true; // Tras el primer tiro, arranca la estampida general
}

function createBloodParticles(x, y) {
    for(let i=0; i<12; i++) {
        particles.push({
            x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4 - 1,
            radius: 2+Math.random()*2, alpha: 1, color: mode==='patos'?'#e0f2f1':'#520202', life: 18
        });
    }
}

// --- TRACKPAD TÁCTIL VERTICAL ---
let touchLastX = 0, touchLastY = 0, isTouching = false;
function onTrackpadStart(e) {
    if (isPaused) return; e.preventDefault(); initAudio();
    if (!e.touches.length) return;
    isTouching = true; trackpad.classList.add('active');
    touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY;
}
function onTrackpadMove(e) {
    e.preventDefault(); if (!isTouching || isPaused || !e.touches.length) return;
    const touch = e.touches[0];
    crosshair.x += (touch.clientX - touchLastX) * TRACKPAD_SENSITIVITY;
    crosshair.y += (touch.clientY - touchLastY) * TRACKPAD_SENSITIVITY;
    touchLastX = touch.clientX; touchLastY = touch.clientY;
}
function onTrackpadEnd(e) {
    e.preventDefault(); if (!isTouching || isPaused) return;
    isTouching = false; trackpad.classList.remove('active');
    fire();
}
trackpad.addEventListener('touchstart', onTrackpadStart, {passive: false});
trackpad.addEventListener('touchmove', onTrackpadMove, {passive: false});
trackpad.addEventListener('touchend', onTrackpadEnd, {passive: false});

// --- ENLACES Y LOGICA DE MENÚS ---
const btnCortadero = document.getElementById('btnModoCortadero');
const btnPatos = document.getElementById('btnModoPatos');
const panelArmasMonte = document.getElementById('panelArmasMonte');
const panelEspecies = document.getElementById('panelEspecies');
const btnRifleMenu = document.getElementById('btnRifleMenu');
const btnEscopetaMenu = document.getElementById('btnEscopetaMenu');

function checkModeRestrictions() {
    if (mode === 'patos') {
        currentWeapon = 'escopeta'; panelArmasMonte.style.display = 'none'; panelEspecies.style.display = 'none';
    } else {
        panelArmasMonte.style.display = 'block'; panelEspecies.style.display = 'block';
        currentWeapon = btnRifleMenu.classList.contains('selected') ? 'rifle' : 'escopeta';
    }
}

btnCortadero.addEventListener('click', () => { mode = 'cortadero'; btnCortadero.classList.add('selected'); btnPatos.classList.remove('selected'); checkModeRestrictions(); });
btnPatos.addEventListener('click', () => { mode = 'patos'; btnPatos.classList.add('selected'); btnCortadero.classList.remove('selected'); checkModeRestrictions(); });
btnRifleMenu.addEventListener('click', () => { btnRifleMenu.classList.add('selected'); btnEscopetaMenu.classList.remove('selected'); currentWeapon = 'rifle'; });
btnEscopetaMenu.addEventListener('click', () => { btnEscopetaMenu.classList.add('selected'); btnRifleMenu.classList.remove('selected'); currentWeapon = 'escopeta'; });

document.getElementById('btnStart').addEventListener('click', () => { initAudio(); document.getElementById('mainMenu').style.display = 'none'; resetGame(); });
document.getElementById('btnRestart').addEventListener('click', () => { document.getElementById('resultsMenu').style.display = 'none'; resetGame(); });
document.getElementById('btnHome').addEventListener('click', () => { gameActive = false; isPaused = true; document.getElementById('pauseMenu').style.display = 'none'; document.getElementById('resultsMenu').style.display = 'none'; document.getElementById('mainMenu').style.display = 'flex'; });

document.getElementById('pauseBtn').addEventListener('click', () => {
    isPaused = true;
    if (mode === 'patos') {
        document.getElementById('panelArmasPausa').style.display = 'none'; document.getElementById('lblAvisoPatos').style.display = 'block';
    } else {
        document.getElementById('panelArmasPausa').style.display = 'block'; document.getElementById('lblAvisoPatos').style.display = 'none';
        if (currentWeapon === 'rifle') {
            document.getElementById('btnRifle').classList.add('selected'); document.getElementById('btnEscopeta').classList.remove('selected');
        } else {
            document.getElementById('btnEscopeta').classList.add('selected'); document.getElementById('btnRifle').classList.remove('selected');
        }
    }
    document.getElementById('pauseMenu').style.display = 'flex';
});

document.getElementById('btnRifle').addEventListener('click', () => { currentWeapon = 'rifle'; document.getElementById('btnRifle').classList.add('selected'); document.getElementById('btnEscopeta').classList.remove('selected'); });
document.getElementById('btnEscopeta').addEventListener('click', () => { currentWeapon = 'escopeta'; document.getElementById('btnEscopeta').classList.add('selected'); document.getElementById('btnRifle').classList.remove('selected'); });
document.getElementById('btnResume').addEventListener('click', () => { isPaused = false; document.getElementById('pauseMenu').style.display = 'none'; });

function setupToggle(id, key) {
    document.getElementById(id).addEventListener('click', function() { activeSpecies[key] = !activeSpecies[key]; this.classList.toggle('selected', activeSpecies[key]); });
}
setupToggle('cfgBoar', 'boar'); setupToggle('cfgCiervo', 'ciervo'); setupToggle('cfgMuflon', 'muflon'); setupToggle('cfgCorzo', 'corzo');

function resetGame() {
    gameTimer = 45; totalKills = 0; totalSpawns = 0; entities = []; particles = [];
    PiaraAlerted = false; isPaused = false; gameActive = true;
    generateEnvironment();
    lastSpawnTime = performance.now();
}

function endGame() {
    gameActive = false; isPaused = true;
    document.getElementById('resultsMenu').style.display = 'flex';
    document.getElementById('resDetails').innerHTML = `LANCE COMPLETADO (${mode==='cortadero'?'Línea de Monte':'Tirada de Ánades'})<br><br>Reses Avistadas: ${totalSpawns}<br>Blancos Cobrados: <span style="color:#4cd964; font-size:24px;">${totalKills}</span>`;
}

// --- CICLO CORE CONTÍNUO ---
let lastTime = 0;
function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000; if (dt > 0.1) dt = 0.1; lastTime = timestamp;

    if (!isPaused && gameActive) {
        gameTimer -= dt;
        document.getElementById('txtTiempo').innerText = `TIEMPO: ${Math.max(0, Math.ceil(gameTimer))}s`;
        document.getElementById('txtKills').innerText = `COBRADOS: ${totalKills}/${totalSpawns}`;
        if (gameTimer <= 0) endGame();

        if (recoilY < 0) { recoilY += dt * 170; if (recoilY > 0) recoilY = 0; }

        let elapsed = timestamp - lastShotTime;
        let progress = Math.min(elapsed / FIRE_DELAY, 1);
        cadenceBar.style.width = (progress * 100) + '%';
        if (progress >= 1) { 
            canShoot = true; cadenceBar.classList.add('ready'); 
            document.getElementById('trackpadLabel').innerText = mode === 'patos' ? "ESCOPETA (CHOKE CERRADO) LISTA" : (currentWeapon === 'rifle' ? "RIFLE DISPONIBLE" : "ESCOPETA DE BALA LISTA");
        } else { 
            canShoot = false; cadenceBar.classList.remove('ready'); 
            document.getElementById('trackpadLabel').innerText = "ENCARANDO PUNTO DE MIRA..."; 
        }

        spawnControl();
        entities.forEach(ent => ent.update(dt * 1000));
    }

    // --- RENDERIZADO DEL ENTORNO DE MONTE BAJO Y RIBERA ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (mode === 'cortadero') {
        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.44);
        skyGrad.addColorStop(0, '#576f80'); skyGrad.addColorStop(0.6, '#8ca0ba'); skyGrad.addColorStop(1, '#b0c2cc');
        ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#2b3325'; ctx.beginPath(); ctx.moveTo(0, canvas.height*0.45); ctx.lineTo(canvas.width*0.3, canvas.height*0.26); ctx.lineTo(canvas.width*0.6, canvas.height*0.36); ctx.lineTo(canvas.width, canvas.height*0.22); ctx.lineTo(canvas.width, canvas.height*0.45); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1e2419'; ctx.beginPath(); ctx.moveTo(0, canvas.height*0.45); ctx.lineTo(canvas.width*0.45, canvas.height*0.32); ctx.lineTo(canvas.width*0.8, canvas.height*0.4); ctx.lineTo(canvas.width, canvas.height*0.29); ctx.lineTo(canvas.width, canvas.height*0.45); ctx.closePath(); ctx.fill();
        
        ctx.fillStyle = '#4f4130'; ctx.fillRect(0, canvas.height * 0.44, canvas.width, canvas.height * 0.56);
    } else {
        ctx.fillStyle = '#7a9cb3'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#213a27'; ctx.beginPath(); ctx.moveTo(0, canvas.height*0.42); ctx.lineTo(canvas.width, canvas.height*0.37); ctx.lineTo(canvas.width, 0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill();
        
        let waterGrad = ctx.createLinearGradient(0, canvas.height*0.4, 0, canvas.height);
        waterGrad.addColorStop(0, '#132224'); waterGrad.addColorStop(1, '#1b3635');
        ctx.fillStyle = waterGrad; ctx.fillRect(0, canvas.height * 0.4, canvas.width, canvas.height * 0.6);
    }

    // Renderizar reses o ánades
    entities.forEach(ent => ent.draw());

    // Arbustos
    bushes.forEach(b => {
        let grad = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.radius);
        grad.addColorStop(0, b.color); grad.addColorStop(0.8, '#1e2617'); grad.addColorStop(1, '#0b0f07');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
    });

    if (!isPaused) {
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha = Math.max(0, p.life / 18); p.life--; ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore(); });
        particles = particles.filter(p => p.life > 0);
    }

    crosshair.x = Math.max(20, Math.min(canvas.width - 20, crosshair.x));
    crosshair.y = Math.max(canvas.height * 0.1, Math.min(canvas.height * 0.76, crosshair.y));

    // --- RENDER DE ARMAS E INTERFAZ RETICULAR ---
    ctx.save();
    let gunX = crosshair.x;
    let gunY = crosshair.y + recoilY;
    let baseW = canvas.width * 0.25;

    // Círculo guía visual cerrado de la escopeta para patos
    if (mode === 'patos' && !isPaused) {
        ctx.strokeStyle = 'rgba(255, 183, 3, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, PATO_CHOKE_RADIUS, 0, Math.PI * 2); ctx.stroke();
    }

    if (mode === 'cortadero' && currentWeapon === 'escopeta') {
        // Interfaz de punto de mira para escopeta disparando bala (Pura precisión sin roza)
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(crosshair.x - 10, crosshair.y); ctx.lineTo(crosshair.x + 10, crosshair.y);
        ctx.moveTo(crosshair.x, crosshair.y - 10); ctx.lineTo(crosshair.x, crosshair.y + 10); ctx.stroke();
    }

    if (mode === 'cortadero' && currentWeapon === 'rifle') {
        // Encarado de Rifle Moderno
        ctx.fillStyle = '#14171a'; ctx.beginPath();
        ctx.moveTo(canvas.width/2 - baseW + (gunX - canvas.width/2)*0.28, canvas.height); ctx.lineTo(canvas.width/2 + baseW + (gunX - canvas.width/2)*0.28, canvas.height);
        ctx.lineTo(gunX + 20, gunY + 110); ctx.lineTo(gunX - 20, gunY + 110); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#1f2429'; ctx.fillRect(gunX - 12, gunY + 45, 24, 65);
        ctx.fillStyle = 'rgba(120, 200, 255, 0.2)'; ctx.beginPath(); ctx.arc(gunX, gunY + 5, 32, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#050505'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(gunX, gunY + 5, 32, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#ff1a1a'; ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, 2.5, 0, Math.PI*2); ctx.fill();
    } else {
        // Encarado de Escopeta Semiautomática
        let woodGrad = ctx.createLinearGradient(gunX - 22, canvas.height, gunX + 22, canvas.height);
        woodGrad.addColorStop(0, '#381e0b'); woodGrad.addColorStop(0.5, '#5e3416'); woodGrad.addColorStop(1, '#241306');
        ctx.fillStyle = woodGrad; ctx.beginPath();
        ctx.moveTo(canvas.width/2 - baseW*0.55 + (gunX - canvas.width/2)*0.22, canvas.height); ctx.lineTo(canvas.width/2 + baseW*0.55 + (gunX - canvas.width/2)*0.22, canvas.height);
        ctx.lineTo(gunX + 13, gunY + 80); ctx.lineTo(gunX - 13, gunY + 80); ctx.closePath(); ctx.fill();

        let metalGrad = ctx.createLinearGradient(gunX - 9, gunY + 80, gunX + 9, gunY + 80);
        metalGrad.addColorStop(0, '#16181a'); metalGrad.addColorStop(0.5, '#33383d'); metalGrad.addColorStop(1, '#0b0c0d');
        ctx.fillStyle = metalGrad; ctx.beginPath();
        ctx.moveTo(gunX - 10, gunY + 80); ctx.lineTo(gunX + 10, gunY + 80); ctx.lineTo(gunX + 4, gunY); ctx.lineTo(gunX - 4, gunY); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, 2.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // Limpieza estricta de memoria para fluidez total en móviles
    entities = entities.filter(ent => !((ent.direction === -1 && ent.x < -250) || (ent.direction === 1 && ent.x > canvas.width + 250) || (ent.dead && ent.type !== 'pato' && ent.deathTimer > 1000) || (ent.dead && ent.type === 'pato' && ent.x > canvas.width + 100)));
    requestAnimationFrame(loop);
}

checkModeRestrictions();
requestAnimationFrame(loop);
</script>
