<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Montero Pro Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: 'Courier New', Courier, monospace; color: #fff; }
        
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        canvas { width: 100%; height: 60%; background: #2a3d24; display: block; }
        
        /* Interfaz del Trackpad (Optimizado Móvil Vertical) */
        #trackpad { width: 100%; height: 40%; background: linear-gradient(135deg, #2c1d11, #1a110a); border-top: 4px solid #4a3319; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; text-align: center; padding: 20px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        #trackpad.active { background: linear-gradient(135deg, #3d2919, #26190f); }
        
        #boltBar { position: absolute; top: 0; left: 0; height: 6px; background: #ff3b30; width: 100%; transition: width 0.1s linear; }
        #boltBar.ready { background: #4cd964; }

        /* Menús e Interfaces Flotantes */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 30px; text-align: center; }
        .menu-card { background: #222; border: 3px solid #5a4225; padding: 20px; border-radius: 10px; width: 100%; max-width: 360px; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
        
        h1 { color: #d4a373; font-size: 24px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        h3 { color: #aaa; font-size: 14px; margin: 15px 0 5px 0; text-align: left; text-transform: uppercase; }
        
        /* Botones e Inputs Estilo Rústico */
        button { background: #4a3319; color: #fff; border: 2px solid #6e4e2a; padding: 12px 20px; font-size: 14px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; margin: 8px 0; text-transform: uppercase; transition: all 0.2s; }
        button:active, button.selected { background: #d4a373; color: #111; border-color: #fff; }
        
        .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 5px; }
        .selector-grid button { font-size: 11px; padding: 8px; margin: 0; }
        
        /* HUD de Juego */
        #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; font-size: 13px; font-weight: bold; text-shadow: 2px 2px 3px #000; }
        #pauseBtn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; padding: 0; margin: 0; z-index: 6; border-radius: 50%; background: rgba(74,51,25,0.7); }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <span id="txtTiempo">TIEMPO: 30s</span>
        <span id="txtKills">RESES: 0/0</span>
    </div>
    <button id="pauseBtn">⏸</button>

    <canvas id="gameCanvas"></canvas>

    <div id="trackpad">
        <div id="boltBar"></div>
        <span id="trackpadLabel">CARGANDO SIMULADOR...</span>
    </div>

    <div id="mainMenu" class="overlay">
        <div class="menu-card">
            <h1>MONTERÍA PRO</h1>
            <p style="font-size: 11px; color:#888; margin-bottom: 15px;">Simulador de Armas e Impactos Balísticos</p>
            
            <h3>MODO DE JUEGO</h3>
            <div class="selector-grid">
                <button id="btnModoCortadero" class="selected">Cortadero</button>
                <button id="btnModoPatos">Ribera Patos</button>
            </div>

            <h3>ESPECIES ACTIVAS</h3>
            <div class="selector-grid">
                <button id="cfgBoar" class="selected">Jabalí</button>
                <button id="cfgCiervo" class="selected">Venado</button>
                <button id="cfgMuflon" class="selected">Muflón</button>
                <button id="cfgCorzo" class="selected">Corzo</button>
            </div>

            <button id="btnStart" style="background:#557a46; border-color:#7a9d54; margin-top:20px; font-size:16px;">Sueltar Rehala (Jugar)</button>
        </div>
    </div>

    <div id="resultsMenu" class="overlay" style="display:none;">
        <div class="menu-card">
            <h1 id="resTitle">FIN DE LA MANGA</h1>
            <p id="resDetails" style="margin: 20px 0; font-size: 16px; line-height: 1.6;"></p>
            <button id="btnRestart" style="background:#557a46;">Nueva Entrada</button>
        </div>
    </div>

    <div id="pauseMenu" class="overlay" style="display:none;">
        <div class="menu-card">
            <h1>PAUSA DE CAZA</h1>
            <h3>CAMBIAR ARMA ENCARADA</h3>
            <button id="btnRifle" class="selected">Rifle Cerrojo (Aimpoint)</button>
            <button id="btnEscopeta">Semiautomática Madera</button>
            <hr style="border:1px solid #333; margin:15px 0;">
            <button id="btnResume" style="background:#7a9d54;">Doblar Puesto (Continuar)</button>
        </div>
    </div>
</div>

<script>
// --- MOTOR DE AUDIO SINTÉTICO (Web Audio API - Cero Archivos Externos) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    if (type === 'shotgun') {
        // Disparo seco y expansivo de cartucho de escopeta/balas
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        let bufferSize = audioCtx.sampleRate * 0.5, buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        let noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'lowpass'; noiseFilter.frequency.setValueAtTime(400, now);
        noiseFilter.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        let noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(1.5, now); noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination); noise.start(now);
    } 
    else if (type === 'rifle') {
        // Trueno de alta velocidad (Rifle de caza mayor)
        let bufferSize = audioCtx.sampleRate * 0.6, buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        let noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'bandpass'; noiseFilter.frequency.setValueAtTime(600, now);
        let noiseGain = audioCtx.createGain(); noiseGain.gain.setValueAtTime(2.0, now); noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination); noise.start(now);
    } 
    else if (type === 'bolt') {
        // Sonido mecánico del cerrojo Mauser (Chic-Chic)
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(1200, now);
        gain.gain.setValueAtTime(0.1, now); gain.gain.setValueAtTime(0, now + 0.05);
        gain.gain.setValueAtTime(0.1, now + 0.15); gain.gain.setValueAtTime(0, now + 0.22);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
    }
    else if (type === 'bark') {
        // Ladrido latido de Podenco / Sabueso en rastro calificado
        let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.05);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.2);
    }
}

// --- VARIABLES DE CONFIGURACIÓN Y ESTADO GLOBAL ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const trackpad = document.getElementById('trackpad');
const boltBar = document.getElementById('boltBar');

// Ajuste dinámico de dimensiones físicas del Canvas
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight * 0.6;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let isPaused = true, gameTimer = 30, totalSpawns = 0, totalKills = 0, lastSpawnTime = 0, gameActive = false;
let currentWeapon = 'rifle', canShoot = true, lastShotTime = 0, recoilY = 0;
let PiaraAlerted = false, entities = [], particles = [], trees = [];
let crosshair = { x: canvas.width / 2, y: canvas.height / 2 };

// Constantes Balísticas (Estilo simulador GAIM)
const RIFLE_BOLT_TIME = 1200, SHOTGUN_FIRE_DELAY = 450, BULLET_FLIGHT_TIME = 0.04, TRACKPAD_SENSITIVITY = 1.6;
const ALERT_PAUSE_DURATION = 400, PANIC_SPEED_MULTIPLIER = 1.95;

// Variables de Menú de Especies
let mode = 'cortadero'; // 'cortadero' o 'patos'
let activeSpecies = { boar: true, ciervo: true, muflon: true, corzo: true };

// --- IMPLEMENTACIÓN DEL ENTORNO DE MONTE Y MONTAÑAS (FOTORREALISTA) ---
function generateEnvironment() {
    trees = [];
    let numTrees = mode === 'cortadero' ? 14 : 6;
    for (let i = 0; i < numTrees; i++) {
        trees.push({
            x: Math.random() * canvas.width,
            width: 25 + Math.random() * 35,
            layer: Math.random() > 0.4 ? 'back' : 'front',
            trunkColor: `rgb(${40 + Math.random()*20}, ${25 + Math.random()*15}, 15)`
        });
    }
}

// --- CLASE ANIMAL CON GEOMETRÍA ANATÓMICA DETALLADA ---
class Animal {
    constructor(type, yOffset, speed, direction, delay = 0, isFemale = false, packLeader = null) {
        this.type = type;
        this.direction = direction;
        this.isFemale = isFemale;
        this.packLeader = packLeader; // Para mecánicas de pelotas de muflones/ciervos
        
        // Ajuste de velocidades base por especie
        this.originalSpeed = (1.2 + speed * 1.1);
        if (type === 'corzo') this.originalSpeed *= 1.4;
        if (type === 'ciervo') this.originalSpeed *= 1.25;
        if (type === 'pato') this.originalSpeed *= 1.8;
        this.currentSpeed = this.originalSpeed * direction;

        // Dimensiones físicas proporcionales
        if (type === 'big_boar')       { this.width = 78; this.height = 54; }
        else if (type === 'small_boar') { this.width = 44; this.height = 30; }
        else if (type === 'ciervo')     { this.width = 95; this.height = 85; }
        else if (type === 'corzo')      { this.width = 44; this.height = 48; }
        else if (type === 'muflon')     { this.width = 74; this.height = 56; }
        else if (type === 'dog')        { this.width = 42; this.height = 32; this.originalSpeed *= 1.35; this.currentSpeed = this.originalSpeed * direction; }
        else if (type === 'pato')       { this.width = 38; this.height = 28; }

        this.x = direction === 1 ? -this.width - delay : canvas.width + delay;
        // Altura de carrera fija según ecosistema
        if (type === 'pato') {
            this.y = (canvas.height * 0.15) + yOffset;
        } else {
            this.y = (canvas.height * 0.52) + yOffset - (type === 'ciervo' ? 24 : (type === 'corzo' ? 14 : 0));
        }

        this.dead = false; this.deathTimer = 0; this.angle = 0; this.legCycle = 0;
        this.alertPaused = false; this.alertPauseTimer = 0; this.panicked = false;
        
        // Atributo específico para perros de agarre
        this.dogTarget = null; this.barkTimer = Math.random() * 500; this.hasBitten = false;
    }

    update(dt) {
        if (this.dead) {
            this.deathTimer += dt;
            if (this.angle < Math.PI / 2) this.angle += 0.18;
            return;
        }

        // LÓGICA DE LA REHALA DE PODENCOS (Solo acosan a Macarenos 'big_boar')
        if (this.type === 'dog') {
            this.barkTimer += dt;
            if (this.barkTimer > 450) { playSound('bark'); this.barkTimer = 0; }

            if (!this.dogTarget) {
                // Buscar el jabalí grande vivo más cercano en su línea de carrera
                this.dogTarget = entities.find(e => e.type === 'big_boar' && !e.dead && Math.abs(e.x - this.x) < 350);
            } else {
                if (this.dogTarget.dead) {
                    this.dogTarget = null;
                    this.currentSpeed = this.originalSpeed * this.direction;
                } else {
                    // Perseguir dinámicamente acelerando el paso
                    let dist = this.dogTarget.x - this.x;
                    if (Math.abs(dist) > 20) {
                        this.currentSpeed = (this.dogTarget.currentSpeed * 1.15);
                    } else {
                        // AGARRE: Se sube al jabalí y frena su avance rígidamente
                        this.hasBitten = true;
                        this.currentSpeed = this.dogTarget.currentSpeed;
                        this.x = this.dogTarget.x - (15 * this.direction);
                        this.y = this.dogTarget.y + 12;
                    }
                }
            }
        }

        // Seguir al jefe de la pelota/manada si existe
        if (this.packLeader && !this.packLeader.dead && !this.dead) {
            this.x = this.packLeader.x - (45 * this.direction) + (this.isFemale ? -15 : 0);
            this.currentSpeed = this.packLeader.currentSpeed;
            if (this.packLeader.alertPaused) { this.currentSpeed = 0; }
        }

        // Gestión de alertas por detonación general
        if (PiaraAlerted && !this.panicked && this.type !== 'dog' && this.type !== 'pato') {
            // El jabalí agarrado no puede pararse por alerta
            if (!this.alertPaused && !this.hasBitten) { 
                this.alertPaused = true; 
                this.alertPauseTimer = 0; 
                this.currentSpeed = 0; 
            }
            this.alertPauseTimer += dt;
            if (this.alertPauseTimer >= ALERT_PAUSE_DURATION) {
                this.panicked = true; this.alertPaused = false;
                this.currentSpeed = this.originalSpeed * PANIC_SPEED_MULTIPLIER * this.direction;
            }
        }

        const step = dt / 16.66;
        this.x += this.currentSpeed * step;
        this.legCycle += Math.abs(this.currentSpeed === 0 ? this.originalSpeed * 0.15 : this.currentSpeed) * 0.25 * step;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        ctx.rotate(this.angle);
        if (this.direction === -1) ctx.scale(-1, 1);
        
        let swing = Math.sin(this.legCycle) * 9;

        if (this.type === 'dog') {
            // Sabueso de Rehala Español
            ctx.fillStyle = '#dcd0c0';
            ctx.beginPath(); ctx.ellipse(0, 2, 20, 11, 0, 0, Math.PI*2); ctx.fill(); // Cuerpo
            ctx.fillStyle = '#b59469'; ctx.fillRect(12, -12, 9, 9); // Cabeza
            ctx.fillStyle = '#7a5e3b'; ctx.fillRect(9, -9, 4, 10); // Oreja caída
            ctx.fillStyle = '#fff'; ctx.fillRect(-20, -5, 4, 11); // Cola en vela
            ctx.fillStyle = '#9e7d52';
            ctx.fillRect(5, 11, 4, 14 + swing); ctx.fillRect(-10, 11, 4, 14 - swing); // Extremidades
        } 
        else if (this.type === 'ciervo') {
            // Venado / Cierva Orgánica
            ctx.fillStyle = '#422c1b'; ctx.fillRect(-16, 14, 5, 28 - swing); ctx.fillRect(14, 14, 5, 28 + swing);
            ctx.fillStyle = '#6b4728'; ctx.beginPath(); ctx.ellipse(-5, 2, 34, 16, 0, 0, Math.PI*2); ctx.fill(); // Tronco musculado
            ctx.fillStyle = '#54381f'; ctx.save(); ctx.rotate(-0.5); ctx.fillRect(16, -30, 14, 32); ctx.restore(); // Cuello esbelto
            ctx.fillStyle = '#6b4728'; ctx.fillRect(20, -34, 20, 11); // Cabeza cónica
            ctx.fillStyle = '#ffd1a4'; ctx.beginPath(); ctx.ellipse(-36, 2, 5, 9, 0, 0, Math.PI*2); ctx.fill(); // Escudo anal blanco

            if (!this.isFemale) {
                // Cuerna ramificada realista de Venado Montero
                ctx.strokeStyle = '#dfd5c6'; ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(20, -34); ctx.lineTo(12, -58); ctx.lineTo(0, -64);
                ctx.moveTo(15, -45); ctx.lineTo(2, -50); ctx.moveTo(12, -55); ctx.lineTo(22, -64);
                ctx.stroke();
            }
            ctx.fillStyle = '#54381f'; ctx.fillRect(-10, 14, 5, 28 + swing); ctx.fillRect(19, 14, 5, 28 - swing);
        } 
        else if (this.type === 'corzo') {
            // Corzo Estival
            ctx.fillStyle = '#663b15'; ctx.fillRect(-8, 10, 4, 20 - swing); ctx.fillRect(8, 10, 4, 20 + swing);
            ctx.fillStyle = '#a05c20'; ctx.beginPath(); ctx.ellipse(-3, 1, 18, 11, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-19, 1, 4, 7, 0, 0, Math.PI*2); ctx.fill(); // Espejo anal puro
            ctx.fillStyle = '#824b1a'; ctx.save(); ctx.rotate(-0.55); ctx.fillRect(8, -20, 8, 18); ctx.restore();
            ctx.fillStyle = '#a05c20'; ctx.fillRect(11, -24, 12, 8);
            ctx.fillStyle = '#222'; ctx.fillRect(9, -30, 3, 6); // Orejas sobredimensionadas
            ctx.fillStyle = '#a05c20'; ctx.fillRect(-5, 10, 4, 20 + swing); ctx.fillRect(11, 10, 4, 20 - swing);
        } 
        else if (this.type === 'muflon') {
            // Muflón Salvaje con Silla
            ctx.fillStyle = '#21140b'; ctx.fillRect(-10, 11, 5, 18 - swing); ctx.fillRect(10, 11, 5, 18 + swing);
            ctx.fillStyle = '#4a2f1b'; ctx.beginPath(); ctx.ellipse(-4, 2, 25, 18, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f0e6df'; ctx.beginPath(); ctx.ellipse(-4, -2, 11, 8, 0, 0, Math.PI*2); ctx.fill(); // Silla o carona blanca
            ctx.fillStyle = '#311e11'; ctx.save(); ctx.rotate(-0.4); ctx.fillRect(12, -12, 12, 18); ctx.restore();
            ctx.fillRect(14, -18, 13, 11);
            
            if (!this.isFemale) {
                // Grandes cuernos espiralados estriados
                ctx.strokeStyle = '#1a1410'; ctx.lineWidth = 6; ctx.beginPath();
                ctx.arc(12, -14, 13, Math.PI * 1.3, Math.PI * 0.4); ctx.stroke();
            }
            ctx.fillStyle = '#311e11'; ctx.fillRect(-6, 11, 5, 18 + swing); ctx.fillRect(13, 11, 5, 18 - swing);
        } 
        else if (this.type === 'pato') {
            // Ánade Real (Modo Patos)
            ctx.fillStyle = '#1c3144'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI*2); ctx.fill(); // Cuerpo azulón
            ctx.fillStyle = '#2b9348'; ctx.beginPath(); ctx.arc(12, -8, 6, 0, Math.PI*2); ctx.fill(); // Cabeza verde ánade
            ctx.fillStyle = '#ffd166'; ctx.fillRect(16, -9, 6, 3); // Pico de pato
            ctx.fillStyle = '#fff'; ctx.fillRect(5, -4, 8, 1); // Collar blanco blanco
            // Alas batiendo dinámicamente con el ciclo
            ctx.fillStyle = '#a2a2a2'; ctx.save(); ctx.translate(-2, -3); ctx.rotate(Math.sin(this.legCycle)*0.8); ctx.fillRect(-4, -12, 10, 12); ctx.restore();
        }
        else {
            // Jabalí fotorrealista (big_boar / small_boar)
            let isBig = (this.type === 'big_boar');
            ctx.fillStyle = isBig ? '#110d0a' : '#261b13';
            ctx.fillRect(isBig?-16:-10, 11, 6, 16-swing); ctx.fillRect(isBig?10:6, 11, 6, 16+swing);
            
            // Silueta ahusada del cochino
            ctx.fillStyle = isBig ? '#1d1712' : '#3d2b1f';
            ctx.beginPath(); ctx.ellipse(0, 0, isBig*10 + 26, isBig*6 + 18, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = isBig ? '#110d0a' : '#261b13';
            ctx.beginPath(); ctx.moveTo(10, -8); ctx.lineTo(isBig?36:22, 6); ctx.lineTo(14, 18); ctx.closePath(); ctx.fill(); // jeta/hocico
            
            ctx.fillStyle = '#050403'; ctx.fillRect(isBig?-22:-12, isBig?-22:-15, isBig*10 + 18, 4); // Cerdas del lomo erizadas
            if (isBig) { ctx.fillStyle = '#fff'; ctx.fillRect(24, 2, 3, 3); } // Navajas / Amoladeras
            ctx.fillStyle = isBig ? '#110d0a' : '#261b13';
            ctx.fillRect(isBig?-10:-6, 11, 6, 17+swing); ctx.fillRect(isBig?13:9, 11, 6, 17-swing);
        }
        ctx.restore();
    }
}

// --- SELECTOR DE APARICIÓN DE PIEZAS (SPAWNER INTELIGENTE) ---
function spawnGroup() {
    if (!gameActive) return;
    const direction = Math.random() > 0.5 ? 1 : -1;
    const baseSpeed = 0.5 + Math.random() * 0.7;
    const yBase = Math.random() * 45;

    // Obtener especies seleccionadas por el usuario
    let pool = [];
    if (mode === 'cortadero') {
        if (activeSpecies.boar) pool.push('boar');
        if (activeSpecies.ciervo) pool.push('ciervo');
        if (activeSpecies.muflon) pool.push('muflon');
        if (activeSpecies.corzo) pool.push('corzo');
    } else {
        pool.push('pato');
    }

    if (pool.length === 0) return;
    let chosen = pool[Math.floor(Math.random() * pool.length)];

    if (chosen === 'boar') {
        totalSpawns++;
        let r = Math.random();
        if (r < 0.3) {
            entities.push(new Animal('big_boar', yBase, baseSpeed, direction));
            // Ocasionalmente meter un sabueso pisándole los talones
            if (Math.random() > 0.5) {
                totalSpawns++;
                entities.push(new Animal('dog', yBase, baseSpeed, direction, 120));
            }
        } else {
            let numSmall = 2 + Math.floor(Math.random() * 2);
            let delayAccum = 0;
            for(let i=0; i<numSmall; i++) {
                totalSpawns++;
                delayAccum += 60 + Math.random()*50;
                entities.push(new Animal('small_boar', yBase + Math.random()*15, baseSpeed, direction, delayAccum));
            }
        }
    } 
    else if (chosen === 'ciervo') {
        // Manada/Pelota de Venados: Un Macho dominante y varias hembras (ciervas) detras
        totalSpawns++;
        let macho = new Animal('ciervo', yBase, baseSpeed * 0.9, direction, 0, false);
        entities.push(macho);
        let numHembras = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < numHembras; i++) {
            totalSpawns++;
            entities.push(new Animal('ciervo', yBase + 10 + i*6, baseSpeed * 0.9, direction, 0, true, macho));
        }
    } 
    else if (chosen === 'muflon') {
        // Pelota compacta de muflones corriendos juntos
        totalSpawns++;
        let lider = new Animal('muflon', yBase, baseSpeed * 1.05, direction, 0, false);
        entities.push(lider);
        for (let i = 0; i < 2; i++) {
            totalSpawns++;
            entities.push(new Animal('muflon', yBase + 8 + i*8, baseSpeed * 1.05, direction, 0, true, lider));
        }
    } 
    else if (chosen === 'corzo') {
        totalSpawns++;
        entities.push(new Animal('corzo', yBase, baseSpeed * 1.2, direction));
    }
    else if (chosen === 'pato') {
        // Parvada flotante de patos en el río
        let numPatos = 2 + Math.floor(Math.random() * 3);
        let d = 0;
        for (let i = 0; i < numPatos; i++) {
            totalSpawns++;
            d += 40 + Math.random()*40;
            entities.push(new Animal('pato', Math.random()*60, baseSpeed, direction, d));
        }
    }
}

function createImpactParticles(x, y, type) {
    const color = type === 'blood' ? '#500000' : (mode === 'patos' ? '#a2c2cf' : '#736048');
    for(let i = 0; i < 15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5)*4.5,
            vy: (Math.random()-0.5)*4.5 - 1.2,
            radius: 2 + Math.random()*2,
            alpha: 1, color: color,
            life: 15 + Math.random()*15
        });
    }
}

// --- EJECUCIÓN DISPARO UNIFICADO (TIROS INFINITOS) ---
function fire() {
    if (!canShoot || isPaused || !gameActive) return;

    canShoot = false;
    lastShotTime = performance.now();
    boltBar.classList.remove('ready');

    if (currentWeapon === 'rifle') {
        playSound('rifle');
        recoilY = -48; // Retroceso vertical violento hacia arriba
        // Cola de ejecución secuencial para simular el rearme mecánico manual "chic-chic"
        setTimeout(() => { playSound('bolt'); }, 400);
    } else {
        playSound('shotgun');
        recoilY = -35; // Retroceso de escopeta más plano
    }

    const shotX = crosshair.x;
    const shotY = crosshair.y;
    let hitAnything = false;
    if (!PiaraAlerted) PiaraAlerted = true;

    for (let ent of entities) {
        if (ent.dead || ent.type === 'dog') continue;
        
        // Adelanto balístico exacto según velocidad transversal del blanco
        const futureX = ent.x + (ent.currentSpeed * BULLET_FLIGHT_TIME * 60);
        if (shotX >= futureX && shotX <= futureX + ent.width && shotY >= ent.y && shotY <= ent.y + ent.height) {
            createImpactParticles(shotX, shotY, 'blood');
            hitAnything = true; ent.dead = true; totalKills++;
            break;
        }
    }
    if (!hitAnything) createImpactParticles(shotX, shotY, 'dust');
}

// --- SISTEMA DE ENTRADA TÁCTIL VERTICAL (TRACKPAD) ---
let touchLastX = 0, touchLastY = 0, isTouching = false;

function onTrackpadStart(e) {
    if (isPaused) return; e.preventDefault(); initAudio();
    if (!e.touches || e.touches.length === 0) return;
    isTouching = true; trackpad.classList.add('active');
    touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY;
}
function onTrackpadMove(e) {
    e.preventDefault(); if (!isTouching || isPaused || !e.touches.length) return;
    const touch = e.touches[0];
    crosshair.x += (touch.clientX - touchLastX) * TRACKPAD_SENSITIVITY;
    crosshair.y += (touch.clientY - touchLastY) * TRACKPAD_SENSITIVITY;
    touchLastX = touch.clientX; touchLastY = touch.clientY;
}
function onTrackpadEnd(e) {
    e.preventDefault(); if (!isTouching || isPaused) return;
    isTouching = false; trackpad.classList.remove('active');
    fire(); // Fuego al levantar el dedo
}

trackpad.addEventListener('touchstart', onTrackpadStart, {passive: false});
trackpad.addEventListener('touchmove', onTrackmove = onTrackpadMove, {passive: false});
trackpad.addEventListener('touchend', onTrackpadEnd, {passive: false});

// Soporte complementario para pruebas en ordenador (Ratón)
trackpad.addEventListener('mousedown', (e) => { initAudio(); if(!isPaused) { isTouching = true; trackpad.classList.add('active'); } });
trackpad.addEventListener('mousemove', (e) => {
    if (isTouching && !isPaused) { crosshair.x += e.movementX * TRACKPAD_SENSITIVITY; crosshair.y += e.movementY * TRACKPAD_SENSITIVITY; }
});
window.addEventListener('mouseup', () => { if (isTouching && !isPaused) { isTouching = false; trackpad.classList.remove('active'); fire(); } });

// --- GESTIÓN DE INTERFACES Y MENÚS ---
document.getElementById('btnStart').addEventListener('click', () => {
    initAudio(); document.getElementById('mainMenu').style.display = 'none'; resetGame();
});
document.getElementById('btnRestart').addEventListener('click', () => {
    document.getElementById('resultsMenu').style.display = 'none'; resetGame();
});
document.getElementById('pauseBtn').addEventListener('click', () => {
    isPaused = true; document.getElementById('pauseMenu').style.display = 'flex';
});
document.getElementById('btnResume').addEventListener('click', () => {
    isPaused = false; document.getElementById('pauseMenu').style.display = 'none';
});

// Selectores de Armas
document.getElementById('btnRifle').addEventListener('click', () => {
    currentWeapon = 'rifle'; canShoot = true;
    document.getElementById('btnRifle').classList.add('selected'); document.getElementById('btnEscopeta').classList.remove('selected');
});
document.getElementById('btnEscopeta').addEventListener('click', () => {
    currentWeapon = 'escopeta'; canShoot = true;
    document.getElementById('btnEscopeta').classList.add('selected'); document.getElementById('btnRifle').classList.remove('selected');
});

// Configuración de Modos de Escenario
document.getElementById('btnModoCortadero').addEventListener('click', () => {
    mode = 'cortadero'; document.getElementById('btnModoCortadero').classList.add('selected'); document.getElementById('btnModoPatos').classList.remove('selected');
});
document.getElementById('btnModoPatos').addEventListener('click', () => {
    mode = 'patos'; document.getElementById('btnModoPatos').classList.add('selected'); document.getElementById('btnModoCortadero').classList.remove('selected');
});

// Toggles de selección de fauna
function setupToggle(id, key) {
    document.getElementById(id).addEventListener('click', function() {
        activeSpecies[key] = !activeSpecies[key];
        this.classList.toggle('selected', activeSpecies[key]);
    });
}
setupToggle('cfgBoar', 'boar'); setupToggle('cfgCiervo', 'ciervo'); setupToggle('cfgMuflon', 'muflon'); setupToggle('cfgCorzo', 'corzo');

function resetGame() {
    gameTimer = 30; totalKills = 0; totalSpawns = 0; entities = []; particles = [];
    PiaraAlerted = false; isPaused = false; gameActive = true;
    generateEnvironment();
    lastSpawnTime = performance.now();
}

function endGame() {
    gameActive = false; isPaused = true;
    document.getElementById('resultsMenu').style.display = 'flex';
    document.getElementById('resDetails').innerHTML = `MODO JUGADO: ${mode === 'cortadero'?'Cortadero':'Ribera del Río'}<br><br>Piezas Avistadas: ${totalSpawns}<br>Piezas Cobradas: <span style="color:#4cd964; font-size:22px;">${totalKills}</span>`;
}

// --- LOOP PRINCIPAL DE RENDERIZADO (DELTA TIME ASÍNCRONO) ---
let lastTime = 0;
function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000; if (dt > 0.1) dt = 0.1; lastTime = timestamp;

    if (!isPaused && gameActive) {
        gameTimer -= dt;
        document.getElementById('txtTiempo').innerText = `TIEMPO: ${Math.max(0, Math.ceil(gameTimer))}s`;
        document.getElementById('txtKills').innerText = `RESES: ${totalKills}/${totalSpawns}`;
        
        if (gameTimer <= 0) { endGame(); }

        // Reducción amortiguada del retroceso del cañón
        if (recoilY < 0) { recoilY += dt * 190; if (recoilY > 0) recoilY = 0; }

        // Temporizadores de rearme de la aguja percutora
        let elapsed = timestamp - lastShotTime;
        if (currentWeapon === 'rifle') {
            let progress = Math.min(elapsed / RIFLE_BOLT_TIME, 1);
            boltBar.style.width = (progress * 100) + '%';
            if (progress >= 1) { canShoot = true; boltBar.classList.add('ready'); document.getElementById('trackpadLabel').innerText = "RIFLE ENCARADO (Aimpoint Listo)"; }
            else { canShoot = false; boltBar.classList.remove('ready'); document.getElementById('trackpadLabel').innerText = "ACCIONANDO CERROJO MAUSER..."; }
        } else {
            let progress = Math.min(elapsed / SHOTGUN_FIRE_DELAY, 1);
            boltBar.style.width = (progress * 100) + '%';
            if (progress >= 1) { canShoot = true; boltBar.classList.add('ready'); document.getElementById('trackpadLabel').innerText = "ESCOPETA SEMIAUTOMÁTICA LISTA"; }
            else { canShoot = false; boltBar.classList.remove('ready'); document.getElementById('trackpadLabel').innerText = "CICLANDO CARTUCHO TRADICIONAL..."; }
        }

        // Lanzador automático de oleadas
        if (entities.length === 0 && timestamp - lastSpawnTime > 1500) { spawnGroup(); lastSpawnTime = timestamp; }

        entities.forEach(ent => ent.update(dt * 1000));
    }

    // --- PROCEDIMIENTO DE DIBUJO EN CANVAS ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (mode === 'cortadero') {
        // FONDO RÚSTICO: Cielo de sierra y montañas lejanas
        ctx.fillStyle = '#b8c0a0'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Cielo encapotado
        ctx.fillStyle = '#4e5340'; ctx.beginPath(); ctx.moveTo(0, canvas.height*0.6); ctx.lineTo(canvas.width*0.3, canvas.height*0.25); ctx.lineTo(canvas.width*0.7, canvas.height*0.45); ctx.lineTo(canvas.width, canvas.height*0.2); ctx.lineTo(canvas.width, canvas.height*0.6); ctx.closePath(); ctx.fill(); // Macizo montañoso
        
        // Suelo del Cortadero (Monte bajo, jaras y tierra)
        ctx.fillStyle = '#7a664d'; ctx.fillRect(0, canvas.height*0.5, canvas.width, canvas.height*0.5);
        ctx.fillStyle = '#596144'; ctx.fillRect(0, canvas.height*0.5, canvas.width, 14); // Línea de vegetación del rastro
    } else {
        // ENTORNO RIBERA: Río de patos y cañaveral
        ctx.fillStyle = '#a2c2cf'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Agua/Cielo claro
        ctx.fillStyle = '#3a5a40'; ctx.beginPath(); ctx.moveTo(0, canvas.height*0.5); ctx.lineTo(canvas.width, canvas.height*0.42); ctx.lineTo(canvas.width, 0); ctx.lineTo(0,0); ctx.closePath(); ctx.fill(); // Orilla lejana
        // Agua del río en primer plano
        ctx.fillStyle = '#283d3b'; ctx.fillRect(0, canvas.height*0.45, canvas.width, canvas.height*0.55);
    }

    // Dibujar pinos de fondo
    trees.filter(t => t.layer === 'back').forEach(t => {
        ctx.fillStyle = t.trunkColor; ctx.fillRect(t.x, canvas.height * 0.15, t.width, canvas.height * 0.5);
    });

    // Pintar reses y fauna
    entities.forEach(ent => ent.draw());

    // Dibujar pinos en primer plano (Ocultación táctica del blanco)
    trees.filter(t => t.layer === 'front').forEach(t => {
        ctx.fillStyle = t.trunkColor; ctx.fillRect(t.x, 0, t.width, canvas.height * 0.9);
    });

    // Físicas balísticas de las partículas flotantes
    if (!isPaused) {
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.alpha = Math.max(0, p.life / 30); p.life--; ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore(); });
        particles = particles.filter(p => p.life > 0);
    }

    // Límites estrictos para la cruz de puntería
    crosshair.x = Math.max(20, Math.min(canvas.width - 20, crosshair.x));
    crosshair.y = Math.max(canvas.height * 0.1, Math.min(canvas.height * 0.8, crosshair.y));

    // --- DISEÑO DE ARMAS (RECONSTRUIDAS PARA REALISMO PRO) ---
    ctx.save();
    let gunX = crosshair.x;
    let gunY = crosshair.y + recoilY; // Vector de desplazamiento del golpe de retroceso
    let baseW = canvas.width * 0.24;

    if (currentWeapon === 'rifle') {
        // RIFLE CON EMBLEMA AIMPOINT HOLOGRÁFICO
        ctx.fillStyle = '#21150b'; ctx.beginPath(); // Culata sintética/madera oscura
        ctx.moveTo(canvas.width/2 - baseW + (gunX - canvas.width/2)*0.35, canvas.height); ctx.lineTo(canvas.width/2 + baseW + (gunX - canvas.width/2)*0.35, canvas.height);
        ctx.lineTo(gunX + 24, gunY + 100); ctx.lineTo(gunX - 24, gunY + 100); ctx.closePath(); ctx.fill();
        
        ctx.fillStyle = '#1c1f22'; ctx.fillRect(gunX - 14, gunY + 45, 28, 55); // Cuerpo del visor tubo exterior
        ctx.fillStyle = 'rgba(100, 180, 255, 0.2)'; ctx.beginPath(); ctx.arc(gunX, gunY + 5, 36, 0, Math.PI*2); ctx.fill(); // Cristal de la Óptica
        ctx.strokeStyle = '#111'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(gunX, gunY + 5, 36, 0, Math.PI*2); ctx.stroke(); // Bisel exterior

        // Punto Rojo central reflectante (Holograma Aimpoint de caza)
        ctx.fillStyle = '#ff1a1a'; ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, 3, 0, Math.PI*2); ctx.fill();
    } else {
        // ESCOPETA CLÁSICA DE REPETICIÓN CON MADERA DE NOGAL VETEADA
        let woodGrad = ctx.createLinearGradient(gunX - 25, canvas.height, gunX + 25, canvas.height);
        woodGrad.addColorStop(0, '#543115'); woodGrad.addColorStop(0.5, '#7c4b24'); woodGrad.addColorStop(1, '#3b220e');
        ctx.fillStyle = woodGrad; ctx.beginPath();
        ctx.moveTo(canvas.width/2 - baseW*0.6 + (gunX - canvas.width/2)*0.3, canvas.height); ctx.lineTo(canvas.width/2 + baseW*0.6 + (gunX - canvas.width/2)*0.3, canvas.height);
        ctx.lineTo(gunX + 15, gunY + 70); ctx.lineTo(gunX - 15, gunY + 70); ctx.closePath(); ctx.fill();

        // Cañón largo pavonado de caza menor/mayor
        let metalGrad = ctx.createLinearGradient(gunX - 10, gunY + 70, gunX + 10, gunY + 70);
        metalGrad.addColorStop(0, '#212529'); metalGrad.addColorStop(0.5, '#495057'); metalGrad.addColorStop(1, '#111214');
        ctx.fillStyle = metalGrad; ctx.beginPath();
        ctx.moveTo(gunX - 12, gunY + 70); ctx.lineTo(gunX + 12, gunY + 70); ctx.lineTo(gunX + 4, gunY); ctx.lineTo(gunX - 4, gunY); ctx.closePath(); ctx.fill();

        // Solista superior ventilada y punto de mira tradicional de latón (dorado)
        ctx.fillStyle = '#0f1112'; ctx.fillRect(gunX - 1.5, gunY, 3, 70);
        ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();

    // Limpieza de memoria e instancias fuera de margen
    entities = entities.filter(ent => !((ent.direction === -1 && ent.x < -200) || (ent.direction === 1 && ent.x > canvas.width + 200) || (ent.dead && ent.deathTimer > 1500)));
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
