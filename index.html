<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Montería Realista - Control Táctil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #12190b;
            font-family: 'Courier New', Courier, monospace; /* Fuente estilo GAIM */
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            color: #ddd;
        }
        #gameArea {
            position: relative;
            flex: 1; /* Ocupa todo el espacio de caza */
            width: 100%;
            background: linear-gradient(to bottom, #3a4d2e, #1a2512);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- ZONA DE CONTROL INFERIOR --- */
        #controlsArea {
            height: 180px; /* Área para el pulgar y botón */
            width: 100%;
            background-color: #1a1a1a;
            border-top: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        /* Área de movimiento style trackpad */
        #trackpad {
            flex: 1;
            height: 100%;
            background: #222;
            border-radius: 10px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 14px;
            border: 1px solid #333;
        }

        /* Botón de Fuego (Gatillo) */
        #fireButton {
            width: 120px;
            height: 100px;
            background-color: #8b0000;
            color: #fff;
            border: 4px solid #b22222;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #5a0000;
            transition: all 0.1s;
        }
        #fireButton:active {
            box-shadow: 0 2px 0 #5a0000;
            transform: translateY(3px);
            background-color: #6a0000;
        }

        /* Indicador visual del cerrojo (más integrado) */
        #boltIndicator {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 80px;
            height: 14px;
            background: #333;
            border-radius: 7px;
            border: 2px solid #555;
            overflow: hidden;
        }
        #boltBar {
            width: 100%;
            height: 100%;
            background: #e74c3c; /* Rojo recargando */
            transition: width 0.1s linear, background-color 0.2s;
        }
        #boltBar.ready {
            background: #2ecc71; /* Verde listo */
        }

    </style>
</head>
<body>

<div id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <div id="boltIndicator"><div id="boltBar"></div></div>
</div>

<div id="controlsArea">
    <div id="trackpad">ARRASTRA PULGAR (MIRA)</div>
    <div id="fireButton">FUEGO</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const boltBar = document.getElementById('boltBar');
const trackpad = document.getElementById('trackpad');
const fireButton = document.getElementById('fireButton');

// Ajustar resolución interna del canvas
function resize() {
    // Definimos una resolución base para que la física sea consistente
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// --- CONFIGURACIÓN DE FÍSICA Y TIEMPOS ---
const BULLET_FLIGHT_TIME = 0.15; // Segundos que tarda la bala (Simula distancia media)
const BOLT_ACTION_TIME = 1600;   // Tiempo de recarga del cerrojo en ms (Limitador)
const TRACKPAD_SENSITIVITY = 1.2; // Multiplicador de movimiento de la mira

// --- ESTADO DEL JUEGO ---
let crosshair = { x: canvas.width / 2, y: canvas.height * 0.4 }; // Mira centrada en zona de caza
let entities = [];
let trees = [];
let particles = [];
let lastSpawnTime = 0;
let nextSpawnDelay = 1000;
let lastShotTime = 0;
let canShoot = true;

// --- GENERACIÓN DE ENTORNO (PINOS ESTILIZADOS CON PROFUNDIDAD) ---
function initTrees() {
    trees = [];
    // Capa fondo (muy oscuros)
    for(let i=0; i<10; i++) {
        trees.push({ x: Math.random() * canvas.width, width: 12 + Math.random()*10, layer: 'back', color: '#13190b' });
    }
    // Capa medio
    for(let i=0; i<7; i++) {
        trees.push({ x: Math.random() * canvas.width, width: 20 + Math.random()*15, layer: 'mid', color: '#0f1408' });
    }
    // Capa frente (más claros y anchos, tapan a los animales)
    for(let i=0; i<6; i++) {
        trees.push({ x: Math.random() * canvas.width, width: 35 + Math.random()*20, layer: 'front', color: '#090c05' });
    }
}
initTrees();

// --- CLASES DE ENTIDADES (ANIMALES) ---
class Animal {
    constructor(type, yOffset, speed, direction, delay = 0) {
        this.type = type; // 'big_boar', 'small_boar', 'dog'
        this.direction = direction; // 1 izq->der, -1 der->izq
        this.speed = speed * direction;
        
        if(type === 'big_boar') {
            this.width = 55; this.height = 35; this.hp = 2; this.color = '#2d1f14';
        } else if(type === 'small_boar') {
            this.width = 30; this.height = 20; this.hp = 1; this.color = '#543c29';
        } else { // Perro
            this.width = 35; this.height = 25; this.hp = 999; this.color = '#c6a687'; // Inmortal
        }

        // Posición inicial fuera con retraso de piara
        this.x = direction === 1 ? -this.width - delay : canvas.width + delay;
        // La zona de caza está en el 40-70% de la altura del canvas
        this.y = (canvas.height * 0.45) + yOffset; 
        
        this.dead = false;
        this.deathTimer = 0;
        this.angle = 0; // Animación caída
    }

    update(dt) {
        if (this.dead) {
            this.deathTimer += dt * 1000;
            if(this.angle < Math.PI / 2) this.angle += 0.08; 
            return;
        }
        // Movimiento suave basado en tiempo (fps)
        this.x += this.speed * dt * 60;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        ctx.rotate(this.angle);
        
        ctx.fillStyle = this.color;
        if(this.type === 'dog') {
            // Perro estilizado
            ctx.beginPath();
            ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI*2);
            ctx.fill();
            // Cabeza
            ctx.fillRect(this.direction * 12, -15, 10, 10);
        } else {
            // Jabalí estilizado (cuerpo robusto, jeta)
            ctx.beginPath();
            // Cuerpo
            ctx.ellipse(0, 5, this.width/2, this.height/2.5, 0, 0, Math.PI*2);
            ctx.fill();
            // Jeta alta
            ctx.fillStyle = this.color;
            ctx.beginPath();
            if(this.direction === 1) { // Mirando a la derecha
                ctx.moveTo(this.width/3, 0);
                ctx.lineTo(this.width/2, -5);
                ctx.lineTo(this.width/2, 10);
            } else { // Mirando a la izquierda
                ctx.moveTo(-this.width/3, 0);
                ctx.lineTo(-this.width/2, -5);
                ctx.lineTo(-this.width/2, 10);
            }
            ctx.fill();
        }
        ctx.restore();
    }
}

// --- LOGICA DE SPAWN ALEATORIO (PIARAS REALISTAS) ---
function spawnGroup() {
    const direction = Math.random() > 0.5 ? 1 : -1;
    // Velocidad variable (rápido = difícil)
    const baseSpeed = 4 + Math.random() * 5; 
    const yBase = Math.random() * 100; // Variación de altura en la franja

    const r = Math.random();
    if (r < 0.45) {
        // Jabalí solitario (macho grande)
        entities.push(new Animal('big_boar', yBase, baseSpeed * 0.9, direction));
    } else if (r < 0.85) {
        // Piara: 1 o 2 grandes + varios pequeños
        const numBig = 1 + Math.floor(Math.random() * 2);
        const numSmall = 3 + Math.floor(Math.random() * 4);
        
        let delayAccum = 0;
        // Madres adelante
        for(let i=0; i<numBig; i++) {
            delayAccum += Math.random() * 40;
            entities.push(new Animal('big_boar', yBase + (Math.random()*20 - 10), baseSpeed * 0.95, direction, delayAccum));
        }
        // Rayones detrás
        for(let i=0; i<numSmall; i++) {
            delayAccum += 35 + Math.random() * 40;
            entities.push(new Animal('small_boar', yBase + 15 + (Math.random()*15), baseSpeed * 1.1, direction, delayAccum));
        }
        
        // Perro persiguiendo (50% prob)
        if(Math.random() > 0.5) {
            delayAccum += 100 + Math.random()*60;
            entities.push(new Animal('dog', yBase + (Math.random()*10 - 5), baseSpeed * 1.25, direction, delayAccum));
        }
    } else {
        // Solo 2 pequeños corriendo juntos
        entities.push(new Animal('small_boar', yBase, baseSpeed * 1.15, direction, 0));
        entities.push(new Animal('small_boar', yBase + 20, baseSpeed * 1.15, direction, 40));
    }
}

// --- EFECTOS DE IMPACTO (SANGRE / POLVO) ---
function createImpactParticles(x, y, type) {
    const color = type === 'blood' ? '#aa0000' : '#d2b48c';
    for(let i=0; i<18; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 3,
            radius: 3 + Math.random() * 5,
            alpha: 1, color: color,
            life: 25 + Math.random() * 25
        });
    }
}

// --- LOGICA DE DISPARO (EL GATILLO) ---
function fire() {
    if (!canShoot) return;
    canShoot = false;
    lastShotTime = performance.now();
    boltBar.classList.remove('ready');

    const shotX = crosshair.x;
    const shotY = crosshair.y;
    let hitAnything = false;

    // Comprobar colisión con cálculo de ADELANTO (Lead)
    for (let ent of entities) {
        if (ent.dead || ent.type === 'dog') continue;

        // ¿Dónde estará el jabalí tras el vuelo de la bala?
        const futureX = ent.x + (ent.speed * BULLET_FLIGHT_TIME * 60);

        // Caja de colisión en posición FUTURA
        if (shotX >= futureX && shotX <= futureX + ent.width &&
            shotY >= ent.y && shotY <= ent.y + ent.height) {
            
            ent.hp--;
            createImpactParticles(shotX, shotY, 'blood');
            hitAnything = true;

            if (ent.hp <= 0) {
                ent.dead = true;
            }
            break; // Solo impacta a uno
        }
    }

    if (!hitAnything) {
        // Falló: Polvo
        createImpactParticles(shotX, shotY, 'dust');
    }
}

// --- NUEVOS CONTROLES TÁCTILES (SEPARADO MOVIMIENTO Y FUEGO) ---

let touchLastX = 0;
let touchLastY = 0;

function onTrackpadMove(e) {
    e.preventDefault();
    if (!e.touches || e.touches.length === 0) return;
    
    const touch = e.touches[0];
    
    if (touchLastX === 0 && touchLastY === 0) {
        // Primer toque, inicializamos
        touchLastX = touch.clientX;
        touchLastY = touch.clientY;
        return;
    }

    // Calculamos el DELTA (cuánto se movió el dedo)
    const dx = (touch.clientX - touchLastX) * TRACKPAD_SENSITIVITY;
    const dy = (touch.clientY - touchLastY) * TRACKPAD_SENSITIVITY;
    
    // Movemos la mira suavemente desde su posición actual
    crosshair.x += dx;
    crosshair.y += dy;

    // Actualizamos la última posición del toque
    touchLastX = touch.clientX;
    touchLastY = touch.clientY;
}

function onTrackpadStart(e) {
    e.preventDefault();
    if (!e.touches || e.touches.length === 0) return;
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
}

function onTrackpadEnd(e) {
    // Reseteamos al levantar el dedo del trackpad
    touchLastX = 0;
    touchLastY = 0;
}

// Eventos de Movimiento (solo en el trackpad)
trackpad.addEventListener('touchstart', onTrackpadStart, {passive: false});
trackpad.addEventListener('touchmove', onTrackpadMove, {passive: false});
trackpad.addEventListener('touchend', onTrackpadEnd, {passive: false});

// Eventos de Disparo (solo en el botón)
fireButton.addEventListener('touchstart', (e) => { e.preventDefault(); fire(); }, {passive: false});

// Fallback para PC (pruebas)
trackpad.addEventListener('mousemove', (e) => {
    if(e.buttons === 1) { // Mover solo si se presiona el botón del mouse
        crosshair.x += e.movementX * TRACKPAD_SENSITIVITY;
        crosshair.y += e.movementY * TRACKPAD_SENSITIVITY;
    }
});
fireButton.addEventListener('mousedown', (e) => { fire(); });


// --- BUCLE PRINCIPAL DE RENDERIZADO (GAME LOOP) ---
let lastTime = 0;

function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = timestamp;

    // 1. Manejo del cerrojo (Recarga visual)
    if (!canShoot) {
        const elapsed = timestamp - lastShotTime;
        const progress = Math.min(elapsed / BOLT_ACTION_TIME, 1);
        boltBar.style.width = (progress * 100) + '%';
        if (progress >= 1) {
            canShoot = true;
            boltBar.classList.add('ready');
        }
    } else {
        boltBar.style.width = '100%';
        boltBar.classList.add('ready');
    }

    // 2. Control de Spawn
    if (timestamp - lastSpawnTime > nextSpawnDelay) {
        spawnGroup();
        lastSpawnTime = timestamp;
        nextSpawnDelay = 4000 + Math.random() * 5000; // Entre 4 y 9 segundos por piara
    }

    // 3. Limpieza y Dibujo del Escenario
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo: Árboles traseros
    trees.filter(t => t.layer === 'back').forEach(t => {
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, 0, t.width, canvas.height);
    });

    // Fondo: Árboles intermedios
    trees.filter(t => t.layer === 'mid').forEach(t => {
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, 0, t.width, canvas.height);
    });

    // Animales
    entities.forEach(ent => {
        ent.update(dt);
        ent.draw();
    });

    // Árboles frontales (Los que ocultan piezas)
    trees.filter(t => t.layer === 'front').forEach(t => {
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, 0, t.width, canvas.height);
    });

    // Partículas
    particles.forEach((p, index) => {
        p.x += p.vx; p.y += p.vy;
        p.vy += 0.12; // Gravedad
        p.alpha = Math.max(0, p.life / 50);
        p.life--;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
    });
    particles = particles.filter(p => p.life > 0);

    // --- DIBUJAR VISOR DE PUNTO ROJO REALISTA (TRANSPARENTE) ---
    ctx.save();
    
    // Limitar la mira a la zona de caza
    crosshair.x = Math.max(0, Math.min(canvas.width, crosshair.x));
    crosshair.y = Math.max(canvas.height*0.2, Math.min(canvas.height*0.8, crosshair.y));

    // Estructura exterior de la mira (Anillo negro muy sutil, no tapa)
    ctx.strokeStyle = 'rgba(10, 15, 5, 0.6)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(crosshair.x, crosshair.y, 45, 0, Math.PI * 2);
    ctx.stroke();

    // El punto rojo central (Aimpoint): Pequeño y muy brillante
    ctx.fillStyle = '#ff1111';
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#ff0000';
    ctx.beginPath();
    ctx.arc(crosshair.x, crosshair.y, 3, 0, Math.PI * 2); // 3px es el "punto"
    ctx.fill();
    ctx.restore();

    requestAnimationFrame(loop);
}

// Iniciar simulador
requestAnimationFrame(loop);
</script>

</body>
</html>
