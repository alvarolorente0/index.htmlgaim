<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cortadero de Montería - Acción Rápida</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f07;
            font-family: monospace;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            color: #ddd;
        }
        #gameArea {
            position: relative;
            flex: 1;
            width: 100%;
            background: linear-gradient(to bottom, #2b3a1a, #141d0b);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- ZONA DE CONTROL INFERIOR --- */
        #controlsArea {
            height: 160px;
            width: 100%;
            background-color: #111;
            border-top: 3px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        #trackpad {
            flex: 1;
            height: 100%;
            background: #1a1a1a;
            border-radius: 8px;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 13px;
            border: 1px solid #2d2d2d;
            letter-spacing: 1px;
        }
        #fireButton {
            width: 120px;
            height: 95px;
            background-color: #a80000;
            color: #fff;
            border: 3px solid #ff3333;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #5a0000;
            transition: all 0.05s;
        }
        #fireButton:active {
            box-shadow: 0 1px 0 #5a0000;
            transform: translateY(3px);
            background-color: #8a0000;
        }
        #boltIndicator {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 70px;
            height: 10px;
            background: #222;
            border-radius: 5px;
            border: 1px solid #444;
            overflow: hidden;
        }
        #boltBar {
            width: 100%;
            height: 100%;
            background: #c0392b;
            transition: width 0.05s linear;
        }
        #boltBar.ready {
            background: #27ae60;
        }
    </style>
</head>
<body>

<div id="gameArea">
    <canvas id="gameCanvas"></canvas>
    <div id="boltIndicator"><div id="boltBar"></div></div>
</div>

<div id="controlsArea">
    <div id="trackpad">DESLIZA AQUÍ PARA APUNTAR</div>
    <div id="fireButton">GATILLO</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const boltBar = document.getElementById('boltBar');
const trackpad = document.getElementById('trackpad');
const fireButton = document.getElementById('fireButton');

function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// --- CONFIGURACIÓN FÍSICA Y BALÍSTICA ---
const BULLET_FLIGHT_TIME = 0.12; // Bala ligeramente más rápida para requerir menos adelanto exagerado
const BOLT_ACTION_TIME = 600;    // ¡RECARGA ULTRA RÁPIDA! (0.6 segundos entre tiros)
const TRACKPAD_SENSITIVITY = 1.5; // Apuntado más ágil en pantalla

// --- ESTADO ---
let crosshair = { x: canvas.width / 2, y: canvas.height * 0.45 };
let entities = [];
let trees = [];
let particles = [];
let lastSpawnTime = 0;
let nextSpawnDelay = 1000;
let lastShotTime = 0;
let canShoot = true;

// --- DISEÑO DEL CORTADERO MEJORADO (CORTADERO MÁS ANCHO) ---
function initCortadero() {
    trees = [];
    const borderZone = canvas.width * 0.15; // Reducido al 15% para dar más zona limpia en el centro

    for (let i = 0; i < 20; i++) { // Menos árboles para no saturar la vista
        const isLeft = Math.random() > 0.5;
        const xBase = isLeft ? Math.random() * borderZone : canvas.width - (Math.random() * borderZone);
        const layer = Math.random() > 0.6 ? 'front' : (Math.random() > 0.3 ? 'mid' : 'back');
        
        let color = '#070b04';
        let width = 30 + Math.random() * 20;
        if (layer === 'mid') { color = '#0e1408'; width = 20 + Math.random() * 15; }
        if (layer === 'back') { color = '#151f0d'; width = 12 + Math.random() * 10; }

        trees.push({ x: xBase, width: width, layer: layer, color: color });
    }
}
initCortadero();

// --- CLASE ANIMAL (TAMAÑOS AGRANDADOS PARA FACILITAR EL TIRO) ---
class Animal {
    constructor(type, yOffset, speed, direction, delay = 0) {
        this.type = type;
        this.direction = direction;
        // Velocidad controlada y constante para que sea predecible y divertido
        this.speed = (1.5 + speed * 1.2) * direction;
        
        // ¡TAMAÑOS AGRANDADOS! Más fáciles de ver y apuntar
        if(type === 'big_boar') {
            this.width = 85; this.height = 55; this.hp = 2; this.color = '#231810';
        } else if(type === 'small_boar') {
            this.width = 52; this.height = 35; this.hp = 1; this.color = '#422f22';
        } else { // Perro sabueso
            this.width = 48; this.height = 32; this.hp = 999; this.color = '#b0916e';
        }

        this.x = direction === 1 ? -this.width - delay : canvas.width + delay;
        this.y = (canvas.height * 0.40) + yOffset; 
        
        this.dead = false;
        this.deathTimer = 0;
        this.angle = 0;
        this.legCycle = 0;
    }

    update(dt) {
        if (this.dead) {
            this.deathTimer += dt * 1000;
            if(this.angle < Math.PI / 2) this.angle += 0.15; 
            return;
        }
        this.x += this.speed * dt * 60;
        this.legCycle += Math.abs(this.speed) * 0.25;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        ctx.rotate(this.angle);
        
        if (this.direction === -1) ctx.scale(-1, 1);
        ctx.fillStyle = this.color;
        
        if(this.type === 'dog') {
            ctx.beginPath();
            ctx.ellipse(0, 0, 20, 11, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.fillRect(12, -16, 10, 10);
            ctx.fillRect(14, -8, 5, 9); 
            let legY = Math.sin(this.legCycle) * 7;
            ctx.fillRect(8, 8, 4, 12 + legY);
            ctx.fillRect(-12, 8, 4, 12 - legY);
        } else {
            // JABALÍ DETALLADO Y GRANDE
            // Cuerpo principal / joroba
            ctx.beginPath();
            ctx.ellipse(-5, -3, 28, 20, 0.1, 0, Math.PI*2);
            ctx.fill();
            
            // Trasero
            ctx.beginPath();
            ctx.ellipse(-20, 4, 20, 16, 0, 0, Math.PI*2);
            ctx.fill();

            // Hocico / Cabeza
            ctx.beginPath();
            ctx.moveTo(10, -8);
            ctx.lineTo(34, 5);   
            ctx.lineTo(20, 16);  
            ctx.lineTo(5, 12);
            ctx.closePath();
            ctx.fill();

            // Oreja
            ctx.beginPath();
            ctx.moveTo(8, -12);
            ctx.lineTo(14, -20);
            ctx.lineTo(15, -10);
            ctx.fill();

            // Patas robustas corriendo
            let legW = this.type === 'big_boar' ? 5.5 : 4;
            let legH = this.type === 'big_boar' ? 18 : 13;
            let swing = Math.sin(this.legCycle) * 8;

            ctx.fillRect(10, 12, legW, legH + swing);
            ctx.fillRect(-18, 12, legW, legH - swing);
        }
        ctx.restore();
    }
}

// --- GENERACIÓN DE PIARAS ---
function spawnGroup() {
    const direction = Math.random() > 0.5 ? 1 : -1;
    const baseSpeed = 0.7 + Math.random() * 1.0; 
    const yBase = Math.random() * 70;

    const r = Math.random();
    if (r < 0.35) {
        entities.push(new Animal('big_boar', yBase, baseSpeed, direction));
    } else {
        const numBig = 1;
        const numSmall = 2 + Math.floor(Math.random() * 2);
        
        let delayAccum = 0;
        for(let i=0; i<numBig; i++) {
            delayAccum += Math.random() * 60;
            entities.push(new Animal('big_boar', yBase + (Math.random()*16 - 8), baseSpeed, direction, delayAccum));
        }
        for(let i=0; i<numSmall; i++) {
            // Más espacio entre cochinos para que te dé tiempo a apuntar uno a uno
            delayAccum += 80 + Math.random() * 50; 
            entities.push(new Animal('small_boar', yBase + 15, baseSpeed * 1.05, direction, delayAccum));
        }
        if(Math.random() > 0.5) {
            delayAccum += 150 + Math.random() * 50;
            entities.push(new Animal('dog', yBase, baseSpeed * 1.15, direction, delayAccum));
        }
    }
}

// --- PARTÍCULAS ---
function createImpactParticles(x, y, type) {
    const color = type === 'blood' ? '#9e0000' : '#b39f82';
    const count = type === 'blood' ? 22 : 15;
    for(let i=0; i<count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 7,
            vy: (Math.random() - 0.5) * 7 - 3,
            radius: 3 + Math.random() * 4,
            alpha: 1, color: color,
            life: 20 + Math.random() * 20
        });
    }
}

// --- DISPARO ---
function fire() {
    if (!canShoot) return;
    canShoot = false;
    lastShotTime = performance.now();
    boltBar.classList.remove('ready');

    const shotX = crosshair.x;
    const shotY = crosshair.y;
    let hitAnything = false;

    for (let ent of entities) {
        if (ent.dead || ent.type === 'dog') continue;

        const futureX = ent.x + (ent.speed * BULLET_FLIGHT_TIME * 60);

        if (shotX >= futureX && shotX <= futureX + ent.width &&
            shotY >= ent.y && shotY <= ent.y + ent.height) {
            
            ent.hp--;
            createImpactParticles(shotX, shotY, 'blood');
            hitAnything = true;

            if (ent.hp <= 0) ent.dead = true;
            break;
        }
    }
    if (!hitAnything) createImpactParticles(shotX, shotY, 'dust');
}

// --- CONTROLES ---
let touchLastX = 0, touchLastY = 0;

function onTrackpadMove(e) {
    e.preventDefault();
    if (!e.touches || e.touches.length === 0) return;
    const touch = e.touches[0];
    
    if (touchLastX === 0 && touchLastY === 0) {
        touchLastX = touch.clientX; touchLastY = touch.clientY;
        return;
    }

    const dx = (touch.clientX - touchLastX) * TRACKPAD_SENSITIVITY;
    const dy = (touch.clientY - touchLastY) * TRACKPAD_SENSITIVITY;
    
    crosshair.x += dx;
    crosshair.y += dy;

    touchLastX = touch.clientX;
    touchLastY = touch.clientY;
}

trackpad.addEventListener('touchstart', (e) => { e.preventDefault(); if(e.touches.length > 0) { touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY; } }, {passive: false});
trackpad.addEventListener('touchmove', onTrackpadMove, {passive: false});
trackpad.addEventListener('touchend', () => { touchLastX = 0; touchLastY = 0; }, {passive: false});
fireButton.addEventListener('touchstart', (e) => { e.preventDefault(); fire(); }, {passive: false});

trackpad.addEventListener('mousemove', (e) => { if(e.buttons === 1) { crosshair.x += e.movementX * TRACKPAD_SENSITIVITY; crosshair.y += e.movementY * TRACKPAD_SENSITIVITY; } });
fireButton.addEventListener('mousedown', fire);

// --- BUCLE PRINCIPAL ---
let lastTime = 0;

function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = timestamp;

    if (!canShoot) {
        const elapsed = timestamp - lastShotTime;
        const progress = Math.min(elapsed / BOLT_ACTION_TIME, 1);
        boltBar.style.width = (progress * 100) + '%';
        if (progress >= 1) { canShoot = true; boltBar.classList.add('ready'); }
    } else {
        boltBar.style.width = '100%';
        boltBar.classList.add('ready');
    }

    if (timestamp - lastSpawnTime > nextSpawnDelay) {
        spawnGroup();
        lastSpawnTime = timestamp;
        nextSpawnDelay = 5000 + Math.random() * 4000; // Más tiempo entre oleadas para respirar
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    trees.filter(t => t.layer === 'back' || t.layer === 'mid').forEach(t => {
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, 0, t.width, canvas.height);
    });

    entities.forEach(ent => { ent.update(dt); ent.draw(); });

    trees.filter(t => t.layer === 'front').forEach(t => {
        ctx.fillStyle = t.color;
        ctx.fillRect(t.x, 0, t.width, canvas.height);
    });

    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.alpha = Math.max(0, p.life / 40); p.life--;
        ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore();
    });
    particles = particles.filter(p => p.life > 0);

    crosshair.x = Math.max(20, Math.min(canvas.width - 20, crosshair.x));
    crosshair.y = Math.max(canvas.height * 0.15, Math.min(canvas.height * 0.70, crosshair.y));

    // RIFLE DE CERROJO
    ctx.save();
    let gunOffsetX = (crosshair.x - canvas.width / 2) * 0.15;
    let centerX = canvas.width / 2 + gunOffsetX;
    let gunY = canvas.height;

    ctx.fillStyle = '#5c3a21'; 
    ctx.beginPath();
    ctx.moveTo(centerX - 55, gunY);
    ctx.lineTo(centerX - 30, gunY - 95);
    ctx.lineTo(centerX + 30, gunY - 95);
    ctx.lineTo(centerX + 55, gunY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#1e2124';
    ctx.fillRect(centerX - 9, gunY - 145, 18, 65);

    ctx.fillStyle = '#111314';
    ctx.fillRect(centerX - 20, gunY - 115, 40, 25);
    ctx.restore();

    // RETÍCULA AIMPOINT
    ctx.save();
    ctx.strokeStyle = 'rgba(12, 16, 10, 0.45)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(crosshair.x, crosshair.y, 42, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = '#ff1a1a';
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ff0000';
    ctx.beginPath();
    ctx.arc(crosshair.x, crosshair.y, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    entities = entities.filter(ent => !((ent.direction === -1 && ent.x < -150) || (ent.direction === 1 && ent.x > canvas.width + 150) || (ent.dead && ent.deathTimer > 2500)));

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
