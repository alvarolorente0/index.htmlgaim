<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Montero Realista 3D - Curvas Orgánicas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #050804; font-family: 'Courier New', Courier, monospace; color: #fff; }
        
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        canvas { width: 100%; height: 60%; background: #141a10; display: block; }
        
        #trackpad { width: 100%; height: 40%; background: linear-gradient(135deg, #1a120b, #080503); border-top: 4px solid #2b1c0e; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; text-align: center; padding: 20px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        #trackpad.active { background: linear-gradient(135deg, #24190f, #0d0805); }
        
        #cadenceBar { position: absolute; top: 0; left: 0; height: 6px; background: #ff3b30; width: 100%; transition: width 0.05s linear; }
        #cadenceBar.ready { background: #4cd964; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3,5,3,0.94); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; padding: 25px; text-align: center; }
        .menu-card { background: #11140f; border: 2px solid #3d3224; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 0 25px rgba(0,0,0,0.9); }
        
        h1 { color: #b89063; font-size: 20px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 2px 4px #000; }
        h3 { color: #768071; font-size: 12px; margin: 12px 0 6px 0; text-align: left; text-transform: uppercase; letter-spacing: 1px; }
        
        button { background: #24180d; color: #ded8ce; border: 2px solid #422d1a; padding: 11px 16px; font-size: 12px; font-family: inherit; font-weight: bold; cursor: pointer; border-radius: 6px; width: 100%; margin: 5px 0; text-transform: uppercase; transition: all 0.1s ease; }
        button:active, button.selected { background: #b89063; color: #111; border-color: #fff; box-shadow: 0 0 10px rgba(184,144,99,0.4); }
        
        .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .selector-grid button { font-size: 11px; padding: 8px; margin: 0; }
        
        #hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; font-size: 12px; font-weight: bold; text-shadow: 2px 2px 4px #000; color: #ede8df; }
        .top-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 6; }
        .ctrl-btn { width: 36px; height: 36px; padding: 0; margin: 0; border-radius: 50%; background: rgba(36,24,13,0.8); display: flex; justify-content: center; align-items: center; font-size: 15px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">
        <span id="txtTiempo">TIEMPO: 45s</span>
        <span id="txtKills">RESES: 0/0</span>
    </div>
    
    <div class="top-controls">
        <button id="btnHome" class="ctrl-btn">🏠</button>
        <button id="pauseBtn" class="ctrl-btn">⏸</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="trackpad">
        <div id="cadenceBar"></div>
        <span id="trackpadLabel">SISTEMA EN ADQUISICIÓN...</span>
    </div>

    <div id="mainMenu" class="overlay">
        <div class="menu-card">
            <h1>MONTERÍA REALISTA 3D</h1>
            <p style="font-size: 11px; color:#5c6358; margin-bottom: 12px;">Curvas Anatómicas y Tiempos de Espera Reales</p>
            
            <h3>MODALIDAD</h3>
            <div class="selector-grid">
                <button id="btnModoCortadero" class="selected">Monte / Cortadero</button>
                <button id="btnModoPatos">Ribera / Patos</button>
            </div>

            <div id="panelArmasMonte">
                <h3>OPCIÓN DE ARMA</h3>
                <div class="selector-grid">
                    <button id="btnRifleMenu" class="selected">Rifle (Cerrojo 800ms)</button>
                    <button id="btnEscopetaMenu">Semiaut. (Carrera Rápida)</button>
                </div>
            </div>

            <div id="panelEspecies">
                <h3>ESPECIES DE MONTE</h3>
                <div class="selector-grid">
                    <button id="cfgBoar" class="selected">Jabalí Viejo</button>
                    <button id="cfgCiervo" class="selected">Venado</button>
                    <button id="cfgMuflon" class="selected">Muflón</button>
                    <button id="cfgCorzo" class="selected">Corzo</button>
                </div>
            </div>

            <button id="btnStart" style="background:#2e3d27; border-color:#44593a; margin-top:15px; font-size:14px; color:#fff;">Entrar al Puesto</button>
        </div>
    </div>

    <div id="resultsMenu" class="overlay" style="display:none;">
        <div class="menu-card">
            <h1>PLANTILLA DE COBROS</h1>
            <p id="resDetails" style="margin: 15px 0; font-size: 13px; line-height: 1.6; color: #a9b5a6;"></p>
            <button id="btnRestart" style="background:#2e3d27;">Doblar Puesto</button>
        </div>
    </div>

    <div id="pauseMenu" class="overlay" style="display:none;">
        <div class="menu-card">
            <h1>MANO SUSPENDIDA</h1>
            <div id="panelArmasPausa">
                <h3>CAMBIO DE ARMA</h3>
                <button id="btnRifle" class="selected">Rifle de Caza</button>
                <button id="btnEscopeta">Semiautomática Bala</button>
            </div>
            <p id="lblAvisoPatos" style="display:none; font-size:11px; color:#bd4242; margin: 10px 0;">* En río se caza sin mira con plomeo de 4px.</p>
            <hr style="border:1px solid #232920; margin:12px 0;">
            <button id="btnResume" style="background:#44593a; color:#fff;">Quitar Seguro</button>
        </div>
    </div>
</div>

<script>
// --- MOTOR DE AUDIO ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'shotgun' || type === 'rifle') {
        let isRifle = type === 'rifle';
        let bufferSize = audioCtx.sampleRate * (isRifle ? 0.6 : 0.45), buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        let noise = audioCtx.createBufferSource(); noise.buffer = buffer;
        let filter = audioCtx.createBiquadFilter(); filter.type = isRifle ? 'bandpass' : 'lowpass'; filter.frequency.setValueAtTime(isRifle ? 500 : 350, now);
        let gain = audioCtx.createGain(); gain.gain.setValueAtTime(isRifle ? 2.0 : 1.7, now); gain.gain.exponentialRampToValueAtTime(0.001, now + (isRifle ? 0.5 : 0.35));
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(now);
    }
}

// --- CONFIGURACIÓN GENERACIÓN Y CONTROL ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const trackpad = document.getElementById('trackpad');
const cadenceBar = document.getElementById('cadenceBar');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight * 0.6; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

let isPaused = true, gameTimer = 45, totalSpawns = 0, totalKills = 0, gameActive = false;
let currentWeapon = 'rifle', canShoot = true, lastShotTime = 0, recoilY = 0;
let PiaraAlerted = false, entities = [], particles = [], bushes = [];
let crosshair = { x: canvas.width / 2, y: canvas.height / 2 };

// Control de oleadas para simular esperas sin animales en el puesto
let nextSpawnTimeout = 0; 

let FIRE_DELAY = 800; 
const PATO_CHOKE_RADIUS = 4; 
const TRACKPAD_SENSITIVITY = 1.65;
let mode = 'cortadero'; 
let activeSpecies = { boar: true, ciervo: true, muflon: true, corzo: true };

function generateEnvironment() {
    bushes = [];
    let numBushes = mode === 'cortadero' ? 24 : 12;
    for (let i = 0; i < numBushes; i++) {
        bushes.push({
            x: Math.random() * canvas.width,
            y: canvas.height * (0.46 + Math.random() * 0.36),
            radius: 12 + Math.random() * 22,
            color: `rgb(${40 + Math.random()*15}, ${55 + Math.random()*15}, ${28 + Math.random()*10})`
        });
    }
    bushes.sort((a, b) => a.y - b.y);
}

// --- CLASE ANIMAL: GEOMETRÍA DE CURVAS CURVAS ORGÁNICAS (ADIÓS MINECRAFT) ---
class Animal {
    constructor(type, speed, direction, delay = 0, isFemale = false, packLeader = null) {
        this.type = type;
        this.direction = direction;
        this.isFemale = isFemale;
        this.packLeader = packLeader;

        this.scaleFactor = type === 'pato' ? 0.65 : (currentWeapon === 'rifle' ? 0.38 : 1.05);
        
        if (type === 'corzo') this.baseSpeed = 1.45;
        else if (type === 'pato') this.baseSpeed = 2.4;
        else this.baseSpeed = 0.70 + speed * 0.35;

        if (currentWeapon === 'rifle' && type !== 'pato') this.baseSpeed *= 0.65;
        else if (currentWeapon === 'escopeta' && type !== 'pato') this.baseSpeed *= 1.6; 

        this.currentSpeed = this.baseSpeed * direction;

        if (type === 'big_boar')       { this.w = 90; this.h = 56; }
        else if (type === 'ciervo')     { this.w = 100; this.h = 85; }
        else if (type === 'corzo')      { this.w = 52; this.h = 48; }
        else if (type === 'muflon')     { this.w = 72; this.h = 50; }
        else if (type === 'pato')       { this.w = 38; this.h = 24; }

        this.width = this.w * this.scaleFactor;
        this.height = this.h * this.scaleFactor;
        this.x = direction === 1 ? -this.width - delay : canvas.width + delay;
        
        this.y = type === 'pato' ? canvas.height * 0.15 + (Math.random() * 30) : (currentWeapon === 'rifle' ? (canvas.height * 0.44 + (Math.random()*15)) : (canvas.height * 0.54 + Math.random() * 25));

        this.dead = false; this.deathTimer = 0; this.angle = 0; this.legCycle = 0;
        this.antlerSize = isFemale ? 0 : (0.9 + Math.random() * 0.5); 
        this.vy = 0; this.isFloating = false;
        this.waterLevel = canvas.height * 0.46 + (Math.random() * 30);
    }

    update(dt) {
        const step = dt / 16.66;
        if (this.dead) {
            this.deathTimer += dt;
            if (this.type === 'pato') {
                if (!this.isFloating) {
                    this.vy += 0.35 * step; this.y += this.vy * step;
                    this.x += this.currentSpeed * 0.25 * step;
                    if (this.angle < Math.PI) this.angle += 0.15 * step;
                    if (this.y >= this.waterLevel) { this.y = this.waterLevel; this.isFloating = true; this.vy = 0; }
                } else {
                    this.x += 0.4 * step; this.y += Math.sin(performance.now() * 0.005) * 0.1;
                }
            } else {
                if (this.angle < Math.PI / 2) this.angle += 0.22 * step;
            }
            return;
        }

        if (this.packLeader && !this.packLeader.dead) {
            this.x = this.packLeader.x - (45 * this.direction * this.scaleFactor);
            this.y = this.packLeader.y + (4 * (this.isFemale ? 1 : -1));
            this.currentSpeed = this.packLeader.currentSpeed;
        }

        if (PiaraAlerted && this.type !== 'pato') {
            this.currentSpeed = this.baseSpeed * (this.type === 'corzo' ? 2.3 : 2.0) * this.direction;
        }

        this.x += this.currentSpeed * step;
        this.legCycle += Math.abs(this.currentSpeed) * 0.24 * step;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
        ctx.rotate(this.angle);
        if (this.direction === -1 && !this.isFloating) ctx.scale(-1, 1);

        let swing = this.dead ? 0 : Math.sin(this.legCycle) * 6;
        let s = this.scaleFactor;

        // Patas estilizadas curvas para evitar las líneas rectas
        ctx.strokeStyle = this.type === 'big_boar' ? '#050505' : (this.type === 'ciervo' ? '#26190e' : '#170e08');
        ctx.lineWidth = 5 * s;
        if(this.type !== 'pato') {
            ctx.beginPath(); ctx.moveTo(-10*s, 5*s); ctx.quadraticCurveTo((-12*s) - swing*0.5, 15*s, (-14*s), 26*s); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(10*s, 5*s); ctx.quadraticCurveTo((12*s) + swing*0.5, 15*s, (14*s), 26*s); ctx.stroke();
        }

        if (this.type === 'ciervo') {
            let bodyGrad = ctx.createRadialGradient(-3*s, -4*s, 4*s, -1*s, 0, 32*s);
            bodyGrad.addColorStop(0, '#80542d'); bodyGrad.addColorStop(1, '#2e1c0c');
            ctx.fillStyle = bodyGrad;
            
            // Cuerpo elíptico curvado
            ctx.beginPath();
            ctx.moveTo(-35*s, 4*s);
            ctx.bezierCurveTo(-25*s, -18*s, 10*s, -15*s, 22*s, -6*s);
            ctx.bezierCurveTo(28*s, 5*s, 15*s, 16*s, -15*s, 14*s);
            ctx.bezierCurveTo(-30*s, 12*s, -38*s, 10*s, -35*s, 4*s);
            ctx.fill();

            // Cuello y cabeza fluidos
            ctx.fillStyle = '#59381b'; ctx.beginPath();
            ctx.moveTo(10*s, -8*s);
            ctx.bezierCurveTo(18*s, -26*s, 24*s, -34*s, 28*s, -34*s);
            ctx.bezierCurveTo(38*s, -32*s, 32*s, -18*s, 16*s, 6*s);
            ctx.fill();

            if (!this.isFemale) {
                ctx.strokeStyle = '#e3ded5'; ctx.lineWidth = 2.5 * s; ctx.beginPath();
                let hL = 50 * this.antlerSize * s;
                ctx.moveTo(25*s, -34*s); ctx.quadraticCurveTo(12*s, -34*s - hL*0.8, 4*s, -34*s - hL);
                ctx.moveTo(19*s, -34*s - hL*0.3); ctx.quadraticCurveTo(28*s, -34*s - hL*0.5, 32*s, -34*s - hL*0.6);
                ctx.stroke();
            }
        } 
        else if (this.type === 'corzo') {
            let corzoGrad = ctx.createRadialGradient(-1*s, -2*s, 2*s, 0, 0, 16*s);
            corzoGrad.addColorStop(0, '#bd6f28'); corzoGrad.addColorStop(1, '#422409');
            ctx.fillStyle = corzoGrad; ctx.beginPath();
            ctx.ellipse(0, 2*s, 20*s, 11*s, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#8a4e17'; ctx.beginPath();
            ctx.moveTo(6*s, -3*s); ctx.bezierCurveTo(12*s, -18*s, 15*s, -24*s, 17*s, -24*s);
            ctx.bezierCurveTo(22*s, -22*s, 18*s, -10*s, 11*s, 6*s); ctx.fill();
        }
        else if (this.type === 'muflon') {
            let mufGrad = ctx.createRadialGradient(-2*s, -1*s, 3*s, 0, 0, 22*s);
            mufGrad.addColorStop(0, '#663f23'); mufGrad.addColorStop(1, '#170e08');
            ctx.fillStyle = mufGrad; ctx.beginPath(); ctx.ellipse(0, 0, 25*s, 15*s, 0, 0, Math.PI*2); ctx.fill();
            
            if (!this.isFemale) {
                ctx.strokeStyle = '#241b14'; ctx.lineWidth = 5 * s; ctx.beginPath();
                ctx.arc(12*s, -10*s, 12*s, Math.PI * 1.2, Math.PI * 0.3); ctx.stroke();
            }
        }
        else if (this.type === 'pato') {
            ctx.fillStyle = this.isFloating ? '#1c2833' : '#1c3144'; ctx.beginPath(); ctx.ellipse(0, 0, 16*s, 9*s, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#216c3b'; ctx.beginPath(); ctx.arc(11*s, -7*s, 5*s, 0, Math.PI*2); ctx.fill();
        }
        else {
            // --- JABALÍ MONTERO: SILUETA REDONDEADA ULTRA-REALISTA ---
            let boarGrad = ctx.createLinearGradient(-38*s, -10*s, 32*s, 10*s);
            boarGrad.addColorStop(0, '#090808'); boarGrad.addColorStop(0.4, '#26201a'); boarGrad.addColorStop(1, '#050505');
            ctx.fillStyle = boarGrad;
            
            ctx.beginPath();
            ctx.moveTo(-35*s, 6*s); 
            ctx.bezierCurveTo(-32*s, -16*s, -14*s, -26*s, -4*s, -25*s); // Gran Cruz arqueada del jabalí viejo
            ctx.bezierCurveTo(8*s, -24*s, 18*s, -6*s, 15*s, 10*s); 
            ctx.bezierCurveTo(10*s, 18*s, -15*s, 18*s, -30*s, 12*s); 
            ctx.closePath(); ctx.fill();

            // Jeta afilada pero curva continua
            ctx.fillStyle = '#090808'; ctx.beginPath();
            ctx.moveTo(12*s, -6*s);
            ctx.bezierCurveTo(28*s, 2*s, 36*s, 5*s, 38*s, 6*s); 
            ctx.bezierCurveTo(34*s, 12*s, 22*s, 13*s, 11*s, 10*s); ctx.closePath(); ctx.fill();
            
            // Amoladeras/Navajas
            ctx.fillStyle = '#ffffff'; ctx.beginPath();
            ctx.moveTo(25*s, 6*s); ctx.quadraticCurveTo(27*s, 2*s, 26*s, 1*s); ctx.quadraticCurveTo(23*s, 4*s, 23*s, 6*s); ctx.fill();
        }
        ctx.restore();
    }
}

function spawnControl() {
    if (!gameActive || isPaused) return;

    // Solo genera animales si el temporizador de tregua/espera ha terminado
    let now = performance.now();
    if (entities.length === 0 && now > nextSpawnTimeout) {
        spawnGroup();
        // Genera una tregua obligatoria de 4 a 7 segundos para que el puesto respire limpio
        nextSpawnTimeout = now + 4000 + Math.random() * 3000;
    }
}

function spawnGroup() {
    const direction = Math.random() > 0.5 ? 1 : -1;
    const baseSpeed = 0.5 + Math.random() * 0.4;

    let pool = [];
    if (mode === 'cortadero') {
        if (activeSpecies.boar) pool.push('boar');
        if (activeSpecies.ciervo) pool.push('ciervo');
        if (activeSpecies.muflon) pool.push('muflon');
        if (activeSpecies.corzo) pool.push('corzo');
    } else {
        pool.push('pato');
    }

    if (pool.length === 0) return;
    let chosen = pool[Math.floor(Math.random() * pool.length)];

    if (chosen === 'boar') {
        totalSpawns++; entities.push(new Animal('big_boar', baseSpeed, direction));
        if (Math.random() < 0.40) {
            totalSpawns++; entities.push(new Animal('big_boar', baseSpeed * 0.95, direction, 80 + Math.random()*40));
        }
    } 
    else if (chosen === 'ciervo') {
        totalSpawns++;
        let leader = new Animal('ciervo', baseSpeed * 0.9, direction, 0, false); entities.push(leader);
        let numHembras = 1 + Math.floor(Math.random() * 2);
        for (let i = 0; i < numHembras; i++) {
            totalSpawns++; entities.push(new Animal('ciervo', baseSpeed * 0.9, direction, 0, true, leader));
        }
    } 
    else if (chosen === 'muflon') {
        totalSpawns++;
        let lider = new Animal('muflon', baseSpeed * 0.95, direction, 0, false); entities.push(lider);
        for (let i = 0; i < 2; i++) {
            totalSpawns++; entities.push(new Animal('muflon', baseSpeed * 0.95, direction, 0, true, lider));
        }
    } 
    else if (chosen === 'corzo') {
        totalSpawns++; entities.push(new Animal('corzo', baseSpeed, direction));
    }
    else if (chosen === 'pato') {
        let numPatos = 2 + Math.floor(Math.random() * 2); let d = 0;
        for (let i = 0; i < numPatos; i++) {
            totalSpawns++; d += 50 + Math.random()*40;
            entities.push(new Animal('pato', baseSpeed * 1.05, direction, d));
        }
    }
}

function fire() {
    if (!canShoot || isPaused || !gameActive) return;

    canShoot = false;
    lastShotTime = performance.now();
    cadenceBar.classList.remove('ready');

    const shotX = crosshair.x;
    const shotY = crosshair.y;
    let hitAnything = false;

    if (mode === 'patos') {
        playSound('shotgun'); recoilY = -30;
        for (let i = 0; i < 5; i++) {
            let angle = Math.random() * Math.PI * 2; let dist = Math.random() * PATO_CHOKE_RADIUS;
            particles.push({ x: shotX + Math.cos(angle) * dist, y: shotY + Math.sin(angle) * dist, vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8, radius: 1, alpha: 0.8, color: '#eceff1', life: 4 });
        }
        for (let ent of entities) {
            if (ent.dead) continue;
            let distance = Math.hypot(shotX - (ent.x + ent.width / 2), shotY - (ent.y + ent.height / 2));
            if (distance <= PATO_CHOKE_RADIUS + (ent.width / 2)) {
                createBloodParticles(ent.x + ent.width / 2, ent.y + ent.height / 2);
                hitAnything = true; ent.dead = true; totalKills++;
            }
        }
    } else {
        if (currentWeapon === 'rifle') { playSound('rifle'); recoilY = -42; } else { playSound('shotgun'); recoilY = -40; }
        for (let ent of entities) {
            if (ent.dead) continue;
            let delaySeconds = PiaraAlerted ? 0.16 : 0.01; 
            const targetFutureX = ent.x + (ent.currentSpeed * delaySeconds * 60);

            if (shotX >= targetFutureX && shotX <= targetFutureX + ent.width && shotY >= ent.y && shotY <= ent.y + ent.height) {
                createBloodParticles(shotX, shotY);
                hitAnything = true; ent.dead = true; totalKills++; break;
            }
        }
    }
    
    if (!hitAnything && mode === 'cortadero') {
        for(let i=0; i<8; i++) particles.push({ x: shotX, y: shotY, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, radius: 1.5, alpha: 1, color: '#544738', life: 10 });
    }
    if (!PiaraAlerted) PiaraAlerted = true; 
}

function createBloodParticles(x, y) {
    for(let i=0; i<12; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4 - 1, radius: 2+Math.random()*2, alpha: 1, color: mode==='patos'?'#e0f2f1':'#520202', life: 18 });
}

// --- TRACKPAD ---
let touchLastX = 0, touchLastY = 0, isTouching = false;
function onTrackpadStart(e) { if (isPaused) return; e.preventDefault(); initAudio(); if (!e.touches.length) return; isTouching = true; trackpad.classList.add('active'); touchLastX = e.touches[0].clientX; touchLastY = e.touches[0].clientY; }
function onTrackpadMove(e) { e.preventDefault(); if (!isTouching || isPaused || !e.touches.length) return; const touch = e.touches[0]; crosshair.x += (touch.clientX - touchLastX) * TRACKPAD_SENSITIVITY; crosshair.y += (touch.clientY - touchLastY) * TRACKPAD_SENSITIVITY; touchLastX = touch.clientX; touchLastY = touch.clientY; }
function onTrackpadEnd(e) { e.preventDefault(); if (!isTouching || isPaused) return; isTouching = false; trackpad.classList.remove('active'); fire(); }
trackpad.addEventListener('touchstart', onTrackpadStart, {passive: false});
trackpad.addEventListener('touchmove', onTrackpadMove, {passive: false});
trackpad.addEventListener('touchend', onTrackpadEnd, {passive: false});

// --- MENÚS ---
const btnCortadero = document.getElementById('btnModoCortadero'); const btnPatos = document.getElementById('btnModoPatos');
const panelArmasMonte = document.getElementById('panelArmasMonte'); const panelEspecies = document.getElementById('panelEspecies');
const btnRifleMenu = document.getElementById('btnRifleMenu'); const btnEscopetaMenu = document.getElementById('btnEscopetaMenu');

function checkModeRestrictions() {
    if (mode === 'patos') { currentWeapon = 'escopeta'; FIRE_DELAY = 450; panelArmasMonte.style.display = 'none'; panelEspecies.style.display = 'none'; } 
    else { panelArmasMonte.style.display = 'block'; panelEspecies.style.display = 'block'; currentWeapon = btnRifleMenu.classList.contains('selected') ? 'rifle' : 'escopeta'; FIRE_DELAY = currentWeapon === 'rifle' ? 800 : 450; }
}
btnCortadero.addEventListener('click', () => { mode = 'cortadero'; btnCortadero.classList.add('selected'); btnPatos.classList.remove('selected'); checkModeRestrictions(); });
btnPatos.addEventListener('click', () => { mode = 'patos'; btnPatos.classList.add('selected'); btnCortadero.classList.remove('selected'); checkModeRestrictions(); });
btnRifleMenu.addEventListener('click', () => { btnRifleMenu.classList.add('selected'); btnEscopetaMenu.classList.remove('selected'); checkModeRestrictions(); });
btnEscopetaMenu.addEventListener('click', () => { btnEscopetaMenu.classList.add('selected'); btnRifleMenu.classList.remove('selected'); checkModeRestrictions(); });
document.getElementById('btnStart').addEventListener('click', () => { initAudio(); document.getElementById('mainMenu').style.display = 'none'; resetGame(); });
document.getElementById('btnRestart').addEventListener('click', () => { document.getElementById('resultsMenu').style.display = 'none'; resetGame(); });
document.getElementById('btnHome').addEventListener('click', () => { gameActive = false; isPaused = true; document.getElementById('pauseMenu').style.display = 'none'; document.getElementById('resultsMenu').style.display = 'none'; document.getElementById('mainMenu').style.display = 'flex'; });
document.getElementById('pauseBtn').addEventListener('click', () => { isPaused = true; if (mode === 'patos') { document.getElementById('panelArmasPausa').style.display = 'none'; document.getElementById('lblAvisoPatos').style.display = 'block'; } else { document.getElementById('panelArmasPausa').style.display = 'block'; document.getElementById('lblAvisoPatos').style.display = 'none'; if (currentWeapon === 'rifle') { document.getElementById('btnRifle').classList.add('selected'); document.getElementById('btnEscopeta').classList.remove('selected'); } else { document.getElementById('btnEscopeta').classList.add('selected'); document.getElementById('btnRifle').classList.remove('selected'); } } document.getElementById('pauseMenu').style.display = 'flex'; });
document.getElementById('btnRifle').addEventListener('click', () => { currentWeapon = 'rifle'; FIRE_DELAY = 800; document.getElementById('btnRifle').classList.add('selected'); document.getElementById('btnEscopeta').classList.remove('selected'); });
document.getElementById('btnEscopeta').addEventListener('click', () => { currentWeapon = 'escopeta'; FIRE_DELAY = 450; document.getElementById('btnEscopeta').classList.add('selected'); document.getElementById('btnRifle').classList.remove('selected'); });
document.getElementById('btnResume').addEventListener('click', () => { isPaused = false; document.getElementById('pauseMenu').style.display = 'none'; });

function setupToggle(id, key) { document.getElementById(id).addEventListener('click', function() { activeSpecies[key] = !activeSpecies[key]; this.classList.toggle('selected', activeSpecies[key]); }); }
setupToggle('cfgBoar', 'boar'); setupToggle('cfgCiervo', 'ciervo'); setupToggle('cfgMuflon', 'muflon'); setupToggle('cfgCorzo', 'corzo');

function resetGame() { gameTimer = 45; totalKills = 0; entities = []; particles = []; PiaraAlerted = false; isPaused = false; gameActive = true; generateEnvironment(); nextSpawnTimeout = performance.now() + 1000; }
function endGame() { gameActive = false; isPaused = true; document.getElementById('resultsMenu').style.display = 'flex'; document.getElementById('resDetails').innerHTML = `LANCE COMPLETADO<br><br>Reses Avistadas: ${totalSpawns}<br>Blancos Cobrados: <span style="color:#4cd964; font-size:24px;">${totalKills}</span>`; }

// --- CICLO CORE CONTÍNUO ---
let lastTime = 0;
function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000; if (dt > 0.1) dt = 0.1; lastTime = timestamp;

    if (!isPaused && gameActive) {
        gameTimer -= dt;
        document.getElementById('txtTiempo').innerText = `TIEMPO: ${Math.max(0, Math.ceil(gameTimer))}s`;
        document.getElementById('txtKills').innerText = `COBRADOS: ${totalKills}/${totalSpawns}`;
        if (gameTimer <= 0) endGame();

        if (recoilY < 0) { recoilY += dt * 170; if (recoilY > 0) recoilY = 0; }

        let elapsed = timestamp - lastShotTime;
        let progress = Math.min(elapsed / FIRE_DELAY, 1);
        cadenceBar.style.width = (progress * 100) + '%';
        if (progress >= 1) { 
            canShoot = true; cadenceBar.classList.add('ready'); 
            document.getElementById('trackpadLabel').innerText = mode === 'patos' ? "ESCOPETA LISTA (PLOMEO 4PX)" : (currentWeapon === 'rifle' ? "CERROJO LISTO (800ms)" : "BALA DE ESCOPETA EN RECAMARA");
        } else { 
            canShoot = false; cadenceBar.classList.remove('ready'); 
            document.getElementById('trackpadLabel').innerText = "RECUPERANDO ARMA..."; 
        }

        spawnControl();
        entities.forEach(ent => ent.update(dt * 1000));
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (mode === 'cortadero') {
        let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.44); skyGrad.addColorStop(0, '#576f80'); skyGrad.addColorStop(1, '#b0c2cc'); ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4f4130'; ctx.fillRect(0, canvas.height * 0.44, canvas.width, canvas.height * 0.56);
    } else {
        ctx.fillStyle = '#7a9cb3'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let waterGrad = ctx.createLinearGradient(0, canvas.height * 0.4, 0, canvas.height); waterGrad.addColorStop(0, '#132224'); waterGrad.addColorStop(1, '#1b3635'); ctx.fillStyle = waterGrad; ctx.fillRect(0, canvas.height * 0.4, canvas.width, canvas.height * 0.6);
    }

    entities.forEach(ent => ent.draw());

    // Arbustos con degradado suave radial
    bushes.forEach(b => {
        let grad = ctx.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.radius); grad.addColorStop(0, b.color); grad.addColorStop(1, '#0b0f07');
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
    });

    if (!isPaused) {
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha = Math.max(0, p.life / 18); p.life--; ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore(); });
        particles = particles.filter(p => p.life > 0);
    }

    crosshair.x = Math.max(20, Math.min(canvas.width - 20, crosshair.x));
    crosshair.y = Math.max(canvas.height * 0.1, Math.min(canvas.height * 0.76, crosshair.y));

    // --- INTERFAZ RETÍCULA / CAÑÓN ---
    ctx.save();
    let gunX = crosshair.x; let gunY = crosshair.y + recoilY; let baseW = canvas.width * 0.25;

    if (currentWeapon === 'rifle' && mode === 'cortadero') {
        ctx.fillStyle = '#14171a'; ctx.beginPath();
        ctx.moveTo(canvas.width/2 - baseW + (gunX - canvas.width/2)*0.28, canvas.height); ctx.lineTo(canvas.width/2 + baseW + (gunX - canvas.width/2)*0.28, canvas.height);
        ctx.lineTo(gunX + 20, gunY + 110); ctx.lineTo(gunX - 20, gunY + 110); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(120, 200, 255, 0.15)'; ctx.beginPath(); ctx.arc(gunX, gunY + 5, 32, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#050505'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(gunX, gunY + 5, 32, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#ff1a1a'; ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, 2.5, 0, Math.PI*2); ctx.fill();
    } else {
        // Escopeta instintiva pura (Sin punto amarillo ni círculos Minecraft)
        let woodGrad = ctx.createLinearGradient(gunX - 22, canvas.height, gunX + 22, canvas.height); woodGrad.addColorStop(0, '#381e0b'); woodGrad.addColorStop(1, '#241306'); ctx.fillStyle = woodGrad; ctx.beginPath();
        ctx.moveTo(canvas.width/2 - baseW*0.55 + (gunX - canvas.width/2)*0.22, canvas.height); ctx.lineTo(canvas.width/2 + baseW*0.55 + (gunX - canvas.width/2)*0.22, canvas.height);
        ctx.lineTo(gunX + 13, gunY + 80); ctx.lineTo(gunX - 13, gunY + 80); ctx.closePath(); ctx.fill();
        
        let metalGrad = ctx.createLinearGradient(gunX - 8, gunY + 80, gunX + 8, gunY + 80); metalGrad.addColorStop(0, '#16181a'); metalGrad.addColorStop(1, '#0b0c0d'); ctx.fillStyle = metalGrad; ctx.beginPath();
        ctx.moveTo(gunX - 9, gunY + 80); ctx.lineTo(gunX + 9, gunY + 80); ctx.lineTo(gunX + 3, gunY); ctx.lineTo(gunX - 3, gunY); ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    entities = entities.filter(ent => !((ent.direction === -1 && ent.x < -250) || (ent.direction === 1 && ent.x > canvas.width + 250) || (ent.dead && ent.type !== 'pato' && ent.deathTimer > 1000) || (ent.dead && ent.type === 'pato' && ent.x > canvas.width + 100)));
    requestAnimationFrame(loop);
}

checkModeRestrictions();
requestAnimationFrame(loop);
</script>
