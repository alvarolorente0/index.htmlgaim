<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador de Montería Profesional</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0f07;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            color: #ddd;
        }
        #gameArea {
            position: relative;
            flex: 1;
            width: 100%;
            background: linear-gradient(to bottom, #41533b, #1d2617);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* --- PANEL ÚNICO DE APUNTAR Y DISPARAR --- */
        #controlsArea {
            height: 140px;
            width: 100%;
            background-color: #111;
            border-top: 3px solid #252525;
            padding: 12px;
            position: relative;
        }
        #trackpad {
            width: 100%;
            height: 100%;
            background: #161616;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 13px;
            font-weight: bold;
            border: 2px dashed #333;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.5;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        /* Barra de recarga del cerrojo integrada de fondo en el panel */
        #boltBar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 6px;
            width: 100%;
            background: #c0392b;
            transition: width 0.05s linear;
        }
        #boltBar.ready {
            background: #27ae60;
        }
        #trackpad.active {
            border-color: #8b0000;
            color: #8b0000;
        }
    </style>
</head>
<body>

<div id="gameArea">
    <canvas id="gameCanvas"></canvas>
</div>

<div id="controlsArea">
    <div id="trackpad">
        MANTÉN RECORRIDO PARA APUNTAR<br>¡LEVANTA EL DEDO PARA DISPARAR!
        <div id="boltBar"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const boltBar = document.getElementById('boltBar');
const trackpad = document.getElementById('trackpad');

function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// --- CONFIGURACIÓN DE JUEGO ---
const BULLET_FLIGHT_TIME = 0.10;     
const BOLT_ACTION_TIME = 1000;       
const TRACKPAD_SENSITIVITY = 1.55;   // Un pelo más ágil para compensar el uso de un solo dedo
const ALERT_PAUSE_DURATION = 1000;   
const PANIC_SPEED_MULTIPLIER = 1.4;  

// --- ESTADO ---
let crosshair = { x: canvas.width / 2, y: canvas.height * 0.42 };
let entities = [];
let trees = [];
let particles = [];
let lastSpawnTime = 0;
let lastShotTime = 0;
let canShoot = true;
let PiaraAlerted = false;
let recoilY = 0; 

// --- CORTADERO SÚPER ANCHO ---
function initTrees() {
    trees = [];
    const borderZone = canvas.width * 0.12;
    for (let i = 0; i < 16; i++) {
        const isLeft = Math.random() > 0.5;
        const xBase = isLeft ? Math.random() * borderZone : canvas.width - (Math.random() * borderZone);
        const layer = Math.random() > 0.5 ? 'front' : 'back';
        let trunkColor = '#5e3f2b'; 
        let width = 24 + Math.random() * 16;
        if (layer === 'back') { trunkColor = '#442d1e'; width = 14 + Math.random() * 10; }
        trees.push({ x: xBase, width: width, layer: layer, trunkColor: trunkColor });
    }
}
initTrees();

// --- CLASE ANIMAL (JABALÍES, CIERVOS, CORZOS Y MUFLONES) ---
class Animal {
    constructor(type, yOffset, speed, direction, delay = 0) {
        this.type = type; 
        this.direction = direction;
        this.originalSpeed = (1.5 + speed * 1.1);
        
        if (type === 'corzo') this.originalSpeed *= 1.25; 
        if (type === 'ciervo') this.originalSpeed *= 1.1;  
        
        this.currentSpeed = this.originalSpeed * direction;
        
        if (type === 'big_boar')   { this.width = 76; this.height = 52; }
        else if (type === 'small_boar') { this.width = 48; this.height = 34; }
        else if (type === 'ciervo')     { this.width = 85; this.height = 75; }
        else if (type === 'corzo')      { this.width = 42; this.height = 46; }
        else if (type === 'muflon')     { this.width = 68; this.height = 50; }
        else if (type === 'dog')        { this.width = 42; this.height = 30; }

        this.hp = 1; 
        this.x = direction === 1 ? -this.width - delay : canvas.width + delay;
        this.y = (canvas.height * 0.38) + yOffset - (type === 'ciervo' ? 22 : (type === 'corzo' ? 12 : 0));
        
        this.dead = false; this.deathTimer = 0; this.angle = 0; this.legCycle = 0;
        this.alertPaused = false; this.alertPauseTimer = 0; this.panicked = false;
    }

    update(dt) {
        if (this.dead) {
            this.deathTimer += dt * 1000;
            if(this.angle < Math.PI / 2) this.angle += 0.22; 
            return;
        }
        if (PiaraAlerted && !this.panicked && this.type !== 'dog') {
            if (!this.alertPaused) { this.alertPaused = true; this.alertPauseTimer = 0; this.currentSpeed = 0; }
            this.alertPauseTimer += dt * 1000;
            if (this.alertPauseTimer >= ALERT_PAUSE_DURATION) {
                this.panicked = true; this.alertPaused = false;
                this.currentSpeed = this.originalSpeed * PANIC_SPEED_MULTIPLIER * this.direction;
            }
        }
        this.x += this.currentSpeed * dt * 60;
        this.legCycle += Math.abs(this.currentSpeed === 0 ? this.originalSpeed * 0.1 : this.currentSpeed) * 0.25;
    }

    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        ctx.rotate(this.angle);
        if (this.direction === -1) ctx.scale(-1, 1);
        
        let swing = Math.sin(this.legCycle) * 8;

        if (this.type === 'dog') {
            ctx.fillStyle = '#cfb08c';
            ctx.beginPath(); ctx.ellipse(0, 0, 20, 10, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillRect(12, -14, 9, 9);
            ctx.fillRect(8, 8, 4, 12 + swing); ctx.fillRect(-10, 8, 4, 12 - swing);
            
        } else if (this.type === 'ciervo') {
            ctx.fillStyle = '#4a3319'; ctx.fillRect(-16, 12, 4.5, 26 - swing); ctx.fillRect(14, 12, 4.5, 26 + swing);
            ctx.fillStyle = '#7a5835'; ctx.beginPath(); ctx.ellipse(-6, 0, 28, 16, 0, 0, Math.PI*2); ctx.fill(); 
            ctx.fillStyle = '#8c663e'; ctx.save(); ctx.rotate(-0.5); ctx.fillRect(12, -28, 14, 30); ctx.restore();
            ctx.fillStyle = '#7a5835'; ctx.fillRect(18, -32, 18, 10);
            ctx.strokeStyle = '#d2c4b4'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(18, -32); ctx.lineTo(12, -54); ctx.lineTo(4, -60);
            ctx.moveTo(12, -44); ctx.lineTo(2, -48); ctx.moveTo(14, -50); ctx.lineTo(22, -58); ctx.stroke();
            ctx.fillStyle = '#8c663e'; ctx.fillRect(-10, 12, 5, 26 + swing); ctx.fillRect(18, 12, 5, 26 - swing);

        } else if (this.type === 'corzo') {
            ctx.fillStyle = '#593b1d'; ctx.fillRect(-10, 8, 3.5, 18 - swing); ctx.fillRect(8, 8, 3.5, 18 + swing);
            ctx.fillStyle = '#a66c38'; ctx.beginPath(); ctx.ellipse(-3, 0, 16, 11, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#be7f45'; ctx.save(); ctx.rotate(-0.6); ctx.fillRect(6, -18, 8, 18); ctx.restore();
            ctx.fillRect(8, -22, 12, 7);
            ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(9, -22); ctx.lineTo(7, -30); ctx.moveTo(11, -22); ctx.lineTo(12, -31); ctx.stroke();
            ctx.fillStyle = '#a66c38'; ctx.fillRect(-6, 8, 3.5, 18 + swing); ctx.fillRect(11, 8, 3.5, 18 - swing);

        } else if (this.type === 'muflon') {
            ctx.fillStyle = '#301f11'; ctx.fillRect(-12, 10, 5, 16 - swing); ctx.fillRect(10, 10, 5, 16 + swing);
            ctx.fillStyle = '#543923'; ctx.beginPath(); ctx.ellipse(-4, 0, 24, 17, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#dfd5ca'; ctx.beginPath(); ctx.ellipse(-4, -6, 11, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#422c1b'; ctx.save(); ctx.rotate(-0.4); ctx.fillRect(10, -14, 12, 18); ctx.restore();
            ctx.fillRect(12, -18, 14, 11);
            ctx.strokeStyle = '#2b241e'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(11, -16, 12, Math.PI * 1.3, Math.PI * 0.4); ctx.stroke();
            ctx.fillStyle = '#422c1b'; ctx.fillRect(-7, 10, 5, 16 + swing); ctx.fillRect(13, 10, 5, 16 - swing);

        } else {
            let c1 = this.type === 'big_boar' ? '#1c130c' : '#382517'; 
            let c2 = this.type === 'big_boar' ? '#2e2014' : '#473120'; 
            ctx.fillStyle = '#110b07'; ctx.fillRect(-14, 10, 5, 15 - swing); ctx.fillRect(8, 10, 5, 15 + swing);
            ctx.fillStyle = c1; ctx.beginPath(); ctx.ellipse(-18, 2, 19, 16, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = c2; ctx.beginPath(); ctx.ellipse(-3, -4, 26, 21, 0.08, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#110b07'; ctx.fillRect(-18, -18, 15, 3); ctx.fillRect(-8, -22, 12, 3);
            ctx.fillStyle = c1; ctx.beginPath(); ctx.moveTo(6, -8); ctx.lineTo(32, 6); ctx.lineTo(18, 16); ctx.lineTo(2, 13); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#110b07'; ctx.beginPath(); ctx.moveTo(5, -12); ctx.lineTo(11, -21); ctx.lineTo(13, -11); ctx.closePath(); ctx.fill();
            ctx.fillStyle = c1; ctx.fillRect(-10, 10, 5.5, 16 + swing); ctx.fillRect(11, 10, 5.5, 16 - swing);
        }
        ctx.restore();
    }
}

function spawnGroup() {
    PiaraAlerted = false;
    const direction = Math.random() > 0.5 ? 1 : -1;
    const baseSpeed = 0.5 + Math.random() * 0.7;
    const yBase = Math.random() * 60;
    const globalDice = Math.random();

    if (globalDice < 0.80) {
        const r = Math.random();
        if (r < 0.25) {
            entities.push(new Animal('big_boar', yBase, baseSpeed, direction));
        } else {
            const numSmall = 2 + Math.floor(Math.random() * 2);
            let delayAccum = 0;
            for(let i = 0; i < numSmall; i++) {
                delayAccum += 70 + Math.random() * 60;
                const type = Math.random() > 0.4 ? 'small_boar' : 'big_boar';
                entities.push(new Animal(type, yBase + Math.random()*25, baseSpeed, direction, delayAccum));
            }
            if(Math.random() > 0.5) entities.push(new Animal('dog', yBase + 10, baseSpeed * 1.25, direction, delayAccum + 150));
        }
    } else {
        const rareDice = Math.random();
        if (rareDice < 0.40)      entities.push(new Animal('ciervo', yBase, baseSpeed * 0.95, direction));
        else if (rareDice < 0.75) entities.push(new Animal('muflon', yBase, baseSpeed * 1.05, direction));
        else                      entities.push(new Animal('corzo', yBase, baseSpeed * 1.1, direction));
    }
}

function createImpactParticles(x, y, type) {
    const color = type === 'blood' ? '#800000' : '#a29179';
    for(let i = 0; i < 20; i++) {
        particles.push({ x: x, y: y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6-2, radius: 3+Math.random()*3, alpha: 1, color: color, life: 20+Math.random()*20 });
    }
}

// --- EJECUCIÓN DEL DISPARO ---
function fire() {
    if (!canShoot) return;
    canShoot = false;
    lastShotTime = performance.now();
    boltBar.classList.remove('ready');
    
    recoilY = 45; // Retroceso vertical instantáneo

    const shotX = crosshair.x;
    const shotY = crosshair.y;
    let hitAnything = false;
    if (!PiaraAlerted) PiaraAlerted = true;

    for (let ent of entities) {
        if (ent.dead || ent.type === 'dog') continue;
        const futureX = ent.x + (ent.currentSpeed * BULLET_FLIGHT_TIME * 60);
        if (shotX >= futureX && shotX <= futureX + ent.width && shotY >= ent.y && shotY <= ent.y + ent.height) {
            createImpactParticles(shotX, shotY, 'blood');
            hitAnything = true; ent.dead = true; break;
        }
    }
    if (!hitAnything) createImpactParticles(shotX, shotY, 'dust');
}

// --- NUEVA LÓGICA COCHINERA: APUNTAR Y DISPARAR AL LEVANTAR EL DEDO ---
let touchLastX = 0, touchLastY = 0;
let isTouching = false;

function onTrackpadStart(e) {
    e.preventDefault();
    if (!e.touches || e.touches.length === 0) return;
    isTouching = true;
    trackpad.classList.add('active');
    touchLastX = e.touches[0].clientX;
    touchLastY = e.touches[0].clientY;
}

function onTrackpadMove(e) {
    e.preventDefault();
    if (!isTouching || !e.touches || e.touches.length === 0) return;
    const touch = e.touches[0];
    
    // Desplazamiento de retícula y rifle unificados
    crosshair.x += (touch.clientX - touchLastX) * TRACKPAD_SENSITIVITY;
    crosshair.y += (touch.clientY - touchLastY) * TRACKPAD_SENSITIVITY;
    
    touchLastX = touch.clientX;
    touchLastY = touch.clientY;
}

function onTrackpadEnd(e) {
    e.preventDefault();
    if (!isTouching) return;
    isTouching = false;
    trackpad.classList.remove('active');
    touchLastX = 0;
    touchLastY = 0;
    
    // ¡DISPARO AL SOLTAR! El rifle abre fuego en las coordenadas actuales al levantar el pulgar
    fire();
}

// Eventos táctiles para móvil
trackpad.addEventListener('touchstart', onTrackpadStart, {passive: false});
trackpad.addEventListener('touchmove', onTrackpadMove, {passive: false});
trackpad.addEventListener('touchend', onTrackpadEnd, {passive: false});

// Compatibilidad con Ratón de PC (Hacer clic y arrastrar, dispara al soltar el clic)
trackpad.addEventListener('mousedown', (e) => {
    isTouching = true;
    trackpad.classList.add('active');
});
trackpad.addEventListener('mousemove', (e) => {
    if (isTouching) {
        crosshair.x += e.movementX * TRACKPAD_SENSITIVITY;
        crosshair.y += e.movementY * TRACKPAD_SENSITIVITY;
    }
});
window.addEventListener('mouseup', () => {
    if (isTouching) {
        isTouching = false;
        trackpad.classList.remove('active');
        fire();
    }
});

// --- BUCLE DE RENDERIZADO PRINCIPAL ---
let lastTime = 0;
function loop(timestamp) {
    let dt = (timestamp - lastTime) / 1000; if (dt > 0.1) dt = 0.1; lastTime = timestamp;

    // Recuperación del encare tras el zapatazo del tiro
    if (recoilY > 0) { recoilY -= dt * 260; if (recoilY < 0) recoilY = 0; }

    // Control visual del cerrojo en el fondo del trackpad
    if (!canShoot) {
        const progress = Math.min((timestamp - lastShotTime) / BOLT_ACTION_TIME, 1);
        boltBar.style.width = (progress * 100) + '%';
        if (progress >= 1) { canShoot = true; boltBar.classList.add('ready'); }
    } else { boltBar.style.width = '100%'; boltBar.classList.add('ready'); }

    if (entities.length === 0 && timestamp - lastSpawnTime > 2500) { spawnGroup(); lastSpawnTime = timestamp; }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo: Pinos limpios
    trees.filter(t => t.layer === 'back').forEach(t => {
        ctx.fillStyle = t.trunkColor; ctx.fillRect(t.x, canvas.height * 0.1, t.width, canvas.height * 0.9);
        ctx.fillStyle = '#1e2918'; ctx.beginPath(); ctx.moveTo(t.x - t.width*1.5, canvas.height * 0.38); ctx.lineTo(t.x + t.width / 2, canvas.height * 0.1); ctx.lineTo(t.x + t.width * 2.5, canvas.height * 0.38); ctx.closePath(); ctx.fill();
    });

    // Piezas de caza cruzando
    entities.forEach(ent => { ent.update(dt); ent.draw(); });

    // Árboles frontales laterales (Aseguran espacio limpio en el centro)
    trees.filter(t => t.layer === 'front').forEach(t => {
        ctx.fillStyle = t.trunkColor; ctx.fillRect(t.x, 0, t.width, canvas.height);
        ctx.fillStyle = '#131b0f'; ctx.beginPath(); ctx.moveTo(t.x - t.width * 2, canvas.height * 0.45); ctx.lineTo(t.x + t.width / 2, 0); ctx.lineTo(t.x + t.width * 3, canvas.height * 0.45); ctx.closePath(); ctx.fill();
    });

    // Efectos de impactos
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.alpha = Math.max(0, p.life / 40); p.life--; ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); ctx.restore(); });
    particles = particles.filter(p => p.life > 0);

    // Límites de seguridad del visor
    crosshair.x = Math.max(40, Math.min(canvas.width - 40, crosshair.x));
    crosshair.y = Math.max(canvas.height * 0.15, Math.min(canvas.height * 0.65, crosshair.y));

    // --- ENTIERRO Y ACOPLAMIENTO DE RIFLE/MIRA REALISTA ---
    ctx.save();
    let gunX = crosshair.x;
    let gunY = crosshair.y - recoilY; 
    let baseWidth = canvas.width * 0.22; 
    let screenBottom = canvas.height;

    // Culata madera brillante
    let gradientCulata = ctx.createLinearGradient(gunX - baseWidth, screenBottom, gunX + baseWidth, screenBottom);
    gradientCulata.addColorStop(0, '#a0522d'); gradientCulata.addColorStop(0.3, '#d47320'); gradientCulata.addColorStop(0.7, '#e6822d'); gradientCulata.addColorStop(1, '#8b4513');
    ctx.fillStyle = gradientCulata; ctx.beginPath();
    ctx.moveTo(canvas.width / 2 - baseWidth + (gunX - canvas.width/2)*0.4, screenBottom); ctx.lineTo(canvas.width / 2 + baseWidth + (gunX - canvas.width/2)*0.4, screenBottom);
    ctx.lineTo(gunX + 22, gunY + 110); ctx.lineTo(gunX - 22, gunY + 110); ctx.closePath(); ctx.fill();

    // Mecanismos
    ctx.fillStyle = '#16191c'; ctx.beginPath(); ctx.moveTo(gunX - 18, gunY + 110); ctx.lineTo(gunX + 18, gunY + 110); ctx.lineTo(gunX + 12, gunY + 45); ctx.lineTo(gunX - 12, gunY + 45); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0a0b0d'; ctx.fillRect(gunX - 6, gunY + 45, 12, 60);

    // Montura Aimpoint de la foto
    ctx.fillStyle = '#1c1f22'; ctx.fillRect(gunX - 16, gunY + 28, 32, 18);
    ctx.fillStyle = '#2d3238'; ctx.fillRect(gunX + 15, gunY + 32, 6, 10);

    // Tubo Inferior (Cristal con tratamiento antirreflejos translúcido)
    ctx.fillStyle = 'rgba(180, 215, 255, 0.18)'; 
    ctx.beginPath(); ctx.arc(gunX, gunY + 5, 38, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#121416'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(gunX, gunY + 5, 38, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#1c1f22'; ctx.fillRect(gunX + 36, gunY - 6, 10, 22);
    ctx.fillStyle = '#0d0e10'; ctx.fillRect(gunX + 43, gunY - 4, 3, 18);

    // Tubo Protector Superior Vacío (Ultra transparente)
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)'; 
    ctx.beginPath(); ctx.arc(gunX, gunY - 48, 28, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1c1f22'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(gunX, gunY - 48, 28, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#1c1f22'; ctx.fillRect(gunX - 12, gunY - 26, 24, 12);

    // Retícula: Punto Rojo Luminoso
    ctx.fillStyle = '#ff1a1a'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0000';
    ctx.beginPath(); ctx.arc(crosshair.x, crosshair.y, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Limpieza inteligente de memoria
    entities = entities.filter(ent => !((ent.direction === -1 && ent.x < -180) || (ent.direction === 1 && ent.x > canvas.width + 180) || (ent.dead && ent.deathTimer > 2000)));
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
